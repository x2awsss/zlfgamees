<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيد الإنشاء - الثعبان اون ستريم</title>
    <!-- رابط لخط بكسلات عربي (نقاط) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الخلفية وجعل العناصر تتوسط الشاشة تماماً */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff; /* الخلفية البيضاء الكاملة */
            display: flex;
            justify-content: center; /* توسيع أفقي */
            align-items: center;    /* توسيع عمودي */
            font-family: 'Press Start 2P', cursive, sans-serif; /* استخدام خط البكسلات */
        }

        /* تنسيق النص */
        h1 {
            font-size: 5rem;    /* حجم خط كبير جداً */
            color: #000000;      /* لون الخط أسود */
            margin: 0;
            text-shadow: 2px 2px 0 #cccccc; /* تأثير بسيط لإبراز البكسلات */
            letter-spacing: -2px; /* تقريب الحروف لبعضها بشكل أفضل */
        }

        /* تنسيق للتجاوب مع الشاشات الصغيرة (الجوال) */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem; /* تصغير حجم الخط على الجوال */
                letter-spacing: 0;
            }
        }
    </style>
</head>
<body>

    <!-- النص المطلوب بالمنتصف -->
    <h1>قيد الإنشاء يابن الحلال</h1>

</body>
</html>
