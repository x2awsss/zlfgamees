<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ارسم وخمّن | عالم زلف</title>
     <link class="favicon-icon" rel="icon" type="image/webp" href="https://files.kick.com/images/user/1120744/profile_image/conversion/a86dc276-5226-4cae-89a3-bd7c3389f7f2-fullsize.webp">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
html, body { height:100%; overflow:hidden; overflow-x:hidden !important; max-width:100vw; }
html,body,* { scrollbar-width:none !important; -ms-overflow-style:none !important; }
*::-webkit-scrollbar { display:none !important; width:0 !important; height:0 !important; }

body{
    background:#6a5cff;
    background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 14px);
    color:#1e2a5e;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    height:100vh; position:relative;
    padding:15px 24px 12px;
    overflow:hidden;
}

/* ===== تصميم البار الموحد (نفس بار باقي الألعاب) ===== */
.navbar {
    width: 85%;
    max-width: 1200px;
    height: 70px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    background: rgba(10, 17, 40, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    margin-bottom: 25px;
    margin-top: 5px;
    flex-shrink: 0;
}
.nav-right { display: flex; align-items: center; gap: 15px; }
.nav-logo-icon {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    overflow: hidden; border: 1.5px solid rgba(59, 130, 246, 0.8);
}
.nav-logo-icon img { width: 100%; height: 100%; object-fit: cover; }
.nav-brand {
    font-size: 1.25rem; font-weight: 900;
    background: linear-gradient(45deg, #ffffff, #c3dafe);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.nav-home-btn {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: all 0.3s ease; text-decoration: none;
}
.nav-home-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.08); box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
.nav-home-btn svg { stroke: #fff; }
.nav-center-title {
    font-size: 1.35rem; font-weight: 900;
    background: linear-gradient(45deg, #ffffff, #f87171);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 15px rgba(248, 113, 113, 0.15);
}
.auth-area { display: flex; align-items: center; }
.auth-area .status-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.82rem; font-weight: 800; padding: 6px 18px; border-radius: 50px;
}
.auth-area .status-pill.offline { background: rgba(248,113,113,0.06) !important; color: #f87171 !important; border: 1.5px solid #f87171 !important; box-shadow: 0 0 10px rgba(248,113,113,0.2); }
.auth-area .status-pill.online { background: rgba(83,252,24,0.06) !important; color: #53fc18 !important; border: 1.5px solid #53fc18 !important; box-shadow: 0 0 12px rgba(83,252,24,0.3); }
.auth-area .status-pill.pending { background: rgba(234,179,8,0.06) !important; color: #eab308 !important; border: 1.5px solid #eab308 !important; box-shadow: 0 0 10px rgba(234,179,8,0.2); }
.auth-area .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

/* ===== الإطار الشبيه بالدفتر الحلزوني ===== */
.notebook-frame{
    background:#fdfdf6;
    border:5px solid #3ecf8e;
    border-radius:26px;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
    position:relative;
    padding-top:34px;
    margin-top:auto;
    margin-bottom:auto;
}
.spiral-row{
    position:absolute; top:-24px; left:0; right:0;
    display:flex; justify-content:space-evenly;
    z-index:3;
}
.spiral-ring{
    width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e2e6f0, #9aa0b8 60%, #6b7186);
    border:3px solid #4b5163;
    box-shadow:0 3px 4px rgba(0,0,0,0.3);
}

/* ===== شاشة الإعداد ===== */
#setupScreen{
    width:min(760px, 92vw);
    max-height:76vh;
    overflow-y:auto;
    padding:40px 40px 30px;
}
.brand-badge{
    text-align:center; margin-bottom:26px;
}
.brand-badge .tag{
    display:inline-block; background:#eef1ff; border:2px solid #b9c0f5;
    border-radius:50px; padding:6px 22px; font-size:0.85rem; color:#5b62b8; font-weight:800;
}
.brand-badge h1{
    font-size:1.9rem; font-weight:900; color:#1e2a5e; margin-top:6px;
    background:linear-gradient(90deg,#3ecf8e,#5b62d6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}

.settings-row{
    display:flex; align-items:center; gap:14px; margin-bottom:16px;
}
.settings-row .icon{ font-size:1.4rem; width:30px; text-align:center; flex-shrink:0; }
.settings-row select{
    flex:1; border:2.5px solid #1e2a5e; border-radius:12px;
    padding:12px 16px; font-family:inherit; font-weight:800; font-size:0.95rem;
    color:#1e2a5e; background:#fff; cursor:pointer;
}

.howto{
    display:flex; gap:16px; margin:20px 0; justify-content:center; flex-wrap:wrap;
}
.howto-card{
    flex:1; min-width:180px; max-width:220px;
    background:#eef1ff; border:2px dashed #b9c0f5; border-radius:16px;
    padding:16px; text-align:center; font-weight:800; font-size:0.85rem; color:#3a4180;
}
.howto-card .emoji{ font-size:2rem; display:block; margin-bottom:8px; }

.connect-row{
    display:flex; gap:8px; align-items:center; justify-content:center;
    flex-wrap:wrap; margin:18px 0;
    background:#eef1ff; border:2px solid #b9c0f5; border-radius:16px; padding:12px;
}
.connect-row input{
    border:2px solid #b9c0f5; border-radius:50px; padding:8px 14px;
    font-family:inherit; font-size:0.8rem; outline:none; width:130px;
}
.connect-row button{
    background:#3ecf8e; border:2.5px solid #1e2a5e; color:#0b2f22;
    padding:8px 18px; border-radius:50px; font-weight:900; cursor:pointer;
    font-family:inherit; font-size:0.8rem; box-shadow:0 3px 0 #1e2a5e;
}
.connect-row button:active{ transform:translateY(3px); box-shadow:none; }

.setup-buttons{ display:flex; gap:14px; margin-top:10px; }
.sticker-btn{
    flex:1; border:3px solid #1e2a5e; border-radius:14px; padding:14px;
    font-family:inherit; font-weight:900; font-size:1rem; cursor:pointer;
    text-decoration:none; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 5px 0 #1e2a5e; transition:0.12s;
}
.sticker-btn:active{ transform:translateY(5px); box-shadow:none; }
.sticker-btn.pink{ background:#ff6b81; color:#fff; }
.sticker-btn.pink:hover{ filter:brightness(1.05); }

/* ===== شاشة اللعب ===== */
#gameScreen{
    display:none;
    width:min(1320px, 96vw);
    height:min(760px, 83vh);
    flex-direction:row-reverse;
    gap:0;
    overflow:hidden;
}
#gameScreen.show{ display:flex; }

.side-panel{
    width:290px; flex-shrink:0;
    display:flex; flex-direction:column; gap:14px;
    padding:20px 16px; overflow-y:auto;
}

.panel-box{
    background:#eef1ff; border:2px solid #b9c0f5; border-radius:16px; padding:14px;
}
.panel-box h3{ font-size:0.82rem; color:#3a4180; margin-bottom:10px; font-weight:900; }

#leaderboardList{ display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
.lb-row{
    display:flex; align-items:center; gap:8px; background:#fff;
    border-radius:10px; padding:6px 10px; font-size:0.8rem; font-weight:800; color:#1e2a5e;
}
.lb-rank{
    width:20px; height:20px; border-radius:50%; background:#3ecf8e; color:#0b2f22;
    display:flex; align-items:center; justify-content:center; font-size:0.68rem; flex-shrink:0;
}
.lb-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-score{ color:#5b62d6; }
.lb-empty{ color:#8b91b8; font-size:0.78rem; text-align:center; padding:8px 0; }

.tool-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tool-btn{
    width:36px; height:36px; border-radius:10px; border:2px solid #1e2a5e;
    background:#fff; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
}
.tool-btn.active{ background:#3ecf8e; }
.tool-btn:disabled{ opacity:0.35; cursor:not-allowed; }

.size-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.size-row input[type=range]{ flex:1; accent-color:#5b62d6; }

.swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
.swatch{
    width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer;
    border:2px solid rgba(30,42,94,0.25);
}
.swatch.active{ border-color:#1e2a5e; box-shadow:0 0 0 2px #3ecf8e; }
.swatch.custom{
    display:flex; align-items:center; justify-content:center; font-size:0.9rem;
    background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);
    position:relative; overflow:hidden;
}
.swatch.custom input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

.canvas-panel{
    flex:1; display:flex; flex-direction:column; padding:18px 20px 14px; min-width:0;
}
.canvas-topbar{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}
.icon-btn{
    width:36px; height:36px; border-radius:10px; border:2px solid #1e2a5e; background:#fff;
    cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
}
.round-badge{
    background:#1e2a5e; color:#fff; font-weight:900; font-size:0.85rem;
    padding:6px 16px; border-radius:50px;
}

.canvas-wrap{
    flex:1; position:relative; border:3px solid #1e2a5e; border-radius:16px;
    overflow:hidden; background:#fff; min-height:0;
}
#drawCanvas{ width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }

.countdown-overlay, .roundend-overlay{
    position:absolute; inset:0; background:rgba(30,42,94,0.85);
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    color:#fff; text-align:center; z-index:10; padding:20px;
}
.countdown-overlay.show, .roundend-overlay.show{ display:flex; }
.countdown-num{ font-size:6rem; font-weight:900; animation:pop 0.9s ease; }
@keyframes pop{ 0%{transform:scale(0.4);opacity:0;} 50%{transform:scale(1.15);opacity:1;} 100%{transform:scale(1);opacity:1;} }
.roundend-word{ font-size:1.6rem; font-weight:900; color:#ffd23f; }
.roundend-list{ font-size:0.85rem; max-width:80%; }
.next-round-btn{
    background:#3ecf8e; color:#0b2f22; border:3px solid #fff; border-radius:50px;
    padding:10px 30px; font-weight:900; cursor:pointer; font-family:inherit; margin-top:8px;
}

.canvas-bottombar{
    display:flex; align-items:center; gap:14px; margin-top:10px;
}
.timer-track{
    flex:1; height:14px; background:#dfe3f5; border-radius:50px; overflow:hidden; border:2px solid #1e2a5e;
}
.timer-fill{ height:100%; background:linear-gradient(90deg,#ff6b81,#ffd23f); width:100%; transition:width 0.2s linear; }
.timer-text{ font-weight:900; font-size:0.85rem; min-width:34px; text-align:center; }
.end-round-btn{
    background:#fff; border:2px solid #1e2a5e; border-radius:50px; padding:6px 14px;
    font-weight:800; font-size:0.72rem; cursor:pointer; font-family:inherit;
}

/* ===== صندوق الكاميرا (داخل اللوحة الجانبية، شاشة اللعب فقط) ===== */
.camera-box{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff9d6 !important; border:3px dashed #d8c24a !important;
    text-align:center; min-height:220px;
}
#camIdleState{ color:#8a7a1f; font-weight:800; font-size:1rem; }
#camIdleState .cam-emoji{ font-size:3.2rem; display:block; margin-bottom:10px; }
#camWordInputState{ width:100%; }
#camWordInputState input{
    width:100%; border:2px solid #d8c24a; border-radius:10px; padding:12px 10px;
    font-family:inherit; font-weight:800; text-align:center; margin-bottom:10px; outline:none; font-size:0.95rem;
}
#camWordInputState button{
    width:100%; background:#3ecf8e; border:2px solid #1e2a5e; border-radius:10px;
    padding:12px; font-weight:900; cursor:pointer; font-family:inherit; font-size:0.95rem;
}
#camWordDisplayState{ font-weight:900; color:#5b2a00; font-size:1rem; }
#camWordDisplayState b{ display:block; font-size:1.6rem; margin-top:8px; color:#c0392b; }

#camWordPickState{ width:100%; }
#camWordPickState .pick-title{ font-weight:800; color:#5b2a00; font-size:0.85rem; margin-bottom:10px; }
.word-pick-btn{
    width:100%; background:#fff; border:2.5px solid #1e2a5e; border-radius:10px;
    padding:12px; font-weight:900; cursor:pointer; font-family:inherit; font-size:1rem;
    margin-bottom:8px; color:#1e2a5e; transition:0.15s;
}
.word-pick-btn:hover{ background:#3ecf8e; transform:translateY(-2px); }
.word-pick-btn:last-child{ margin-bottom:0; }

/* ===== شاشة نهاية اللعبة ===== */
.overlay{
    position:fixed; inset:0; background:rgba(20,20,40,0.8); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:200; padding:20px;
}
.overlay.show{ display:flex; }
.finish-card{
    background:#fdfdf6; border:5px solid #ffd23f; border-radius:24px; padding:34px 40px;
    text-align:center; max-width:480px; width:100%;
}
.finish-card h2{ font-size:1.6rem; color:#1e2a5e; margin-bottom:18px; }
.finish-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; max-height:56vh; overflow-y:auto; }
.finish-row{
    display:flex; align-items:center; gap:10px; background:#eef1ff; border-radius:12px;
    padding:10px 14px; font-weight:800; color:#1e2a5e; border:2px solid transparent;
}
.finish-rank{ width:26px; text-align:center; flex-shrink:0; font-size:1rem; }
.finish-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.finish-score{ flex-shrink:0; }
.finish-trophy{ font-size:1.2rem; flex-shrink:0; }

.finish-row.rank-gold{
    background:linear-gradient(135deg,#fff6d0,#ffd23f);
    border-color:#e6a800;
    color:#6b4a00;
    animation:goldGlow 1.5s ease-in-out infinite alternate;
}
.finish-row.rank-silver{
    background:linear-gradient(135deg,#f4f6fb,#d3d9e6);
    border-color:#aab3c5;
    color:#3a4356;
}
.finish-row.rank-bronze{
    background:linear-gradient(135deg,#f3dcc0,#c98a4b);
    border-color:#a5652a;
    color:#4a2c0f;
}
@keyframes goldGlow{
    from{ box-shadow:0 0 10px rgba(255,210,63,0.55), 0 0 22px rgba(255,210,63,0.3); }
    to{ box-shadow:0 0 22px rgba(255,210,63,0.95), 0 0 42px rgba(255,210,63,0.6); }
}

@media (max-width:820px){
    #gameScreen{ flex-direction:column; height:auto; max-height:76vh; overflow-y:auto; }
    .side-panel{ width:100%; flex-direction:row; flex-wrap:wrap; }
    .panel-box{ flex:1; min-width:140px; }
    .canvas-wrap{ min-height:280px; }
}
</style>
</head>
<body>

<!-- 🌐 بار المنصة الرئيسي (نفس بار باقي الألعاب) -->
<nav class="navbar">
    <div class="nav-right">
        <div class="nav-logo-icon">
            <img src="https://files.kick.com/images/user/1120744/profile_image/conversion/a86dc276-5226-4cae-89a3-bd7c3389f7f2-fullsize.webp" alt="ZLF Logo">
        </div>
        <span class="nav-brand">عالم زلف</span>
        <a href="/" class="nav-home-btn" title="العودة للصفحة الرئيسية">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </a>
    </div>

    <div class="nav-center-title">ارسم وخمّن 🎨</div>

    <div class="auth-area">
        <div class="status-pill offline" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">غير متصل</span>
        </div>
    </div>
</nav>

<!-- ===================== شاشة الإعداد ===================== -->
<div class="notebook-frame" id="setupScreen">
    <div class="spiral-row" id="spiralRowSetup"></div>

    <div class="brand-badge">
        <span class="tag">دفتر البثّاث</span>
        <h1>ارسم وخمّن 🎨</h1>
    </div>

    <div class="settings-row">
        <span class="icon">⏱️</span>
        <select id="durationSelect">
            <option value="30">30 ثانية</option>
            <option value="60">60 ثانية</option>
            <option value="90" selected>90 ثانية</option>
            <option value="120">120 ثانية</option>
        </select>
    </div>
    <div class="settings-row">
        <span class="icon">🔁</span>
        <select id="roundsSelect">
            <option value="5">5 راوند</option>
            <option value="10">10 راوند</option>
            <option value="15" selected>15 راوند</option>
            <option value="20">20 راوند</option>
            <option value="30">30 راوند</option>
        </select>
    </div>
    <div class="settings-row">
        <span class="icon">📝</span>
        <select id="wordSourceSelect">
            <option value="custom" selected>أكتب الكلمة بنفسي</option>
            <option value="pick2">يعطيني كلمتين أختار وحدة منهم</option>
        </select>
    </div>

    <div class="howto">
        <div class="howto-card"><span class="emoji">🤔</span>خمّن رسمة البثّاث بالشات</div>
        <div class="howto-card"><span class="emoji">🏆</span>اكسب نقاط وتصدّر الترتيب</div>
    </div>

    <div class="connect-row">
        <input type="text" id="channelNameInput" placeholder="اسم القناة">
        <input type="text" id="chatroomInput" placeholder="رقم غرفة الشات">
        <button onclick="connectToChat()">اتصال بالشات</button>
    </div>

    <div class="setup-buttons">
        <a href="/" class="sticker-btn" style="background:#eef1ff; color:#1e2a5e;">🏠 الرئيسية</a>
        <button class="sticker-btn pink" onclick="startGame()">▶️ ابدأ</button>
    </div>
</div>

<!-- ===================== شاشة اللعب ===================== -->
<div class="notebook-frame" id="gameScreen">
    <div class="spiral-row" id="spiralRowGame"></div>

    <div class="side-panel" id="sidePanel">
        <div class="panel-box">
            <h3>🏆 الترتيب</h3>
            <div id="leaderboardList"><div class="lb-empty">ما فيه نقاط بعد</div></div>
        </div>

        <div class="panel-box">
            <h3>🖌️ أدوات الرسم</h3>
            <div class="tool-row">
                <button class="tool-btn active" id="toolPen" onclick="setTool('pen')" title="قلم">✏️</button>
                <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')" title="ممحاة">🧽</button>
                <button class="tool-btn" id="toolFill" onclick="setTool('fill')" title="تعبئة">🪣</button>
                <button class="tool-btn" onclick="undoStroke()" title="تراجع">↩️</button>
                <button class="tool-btn" onclick="redoStroke()" title="إعادة">↪️</button>
                <button class="tool-btn" onclick="clearCanvas(true)" title="مسح الكل">🗑️</button>
            </div>
            <div class="size-row">
                <span style="font-size:0.7rem;">⚪</span>
                <input type="range" id="sizeSlider" min="2" max="40" value="6">
                <span style="font-size:1.1rem;">⚫</span>
            </div>
            <div class="swatches" id="swatches"></div>
        </div>
        <div class="panel-box camera-box">
            <div id="camIdleState"><span class="cam-emoji">📷</span>ضع الكاميرا هنا</div>
            <div id="camWordInputState" style="display:none;">
                <input type="text" id="wordInput" placeholder="اكتب الكلمة اللي بترسمها" maxlength="30">

<script>
// ===================== حلقات الدفتر الحلزونية =====================
function renderSpirals(id, count){

    el.innerHTML = '';
    for(let i=0;i<count;i++){

renderSpirals('spiralRowSetup', 14);
renderSpirals('spiralRowGame', 16);

// ===================== بنك الكلمات العربي (لوضع "كلمتين أختار بينهم") =====================
const WORD_BANK = [
    // حيوانات
    'قطة','كلب','أسد','فيل','زرافة','حصان','بقرة','خروف','دجاجة','بطة','سمكة','ثعبان',
    'تمساح','سلحفاة','أرنب','قرد','دب','نمر','جمل','فأر','غراب','بومة','نحلة','فراشة',
    'عنكبوت','حوت','دلفين','بطريق','كنغر','حمار','ديك','خفاش','قنفذ','نسر',
    // فواكه وخضار
    'تفاحة','موزة','برتقالة','عنب','بطيخ','فراولة','أناناس','مانجو','خيار','طماطم',
    'بصل','جزرة','بطاطس','ذرة','فلفل','ليمون','رمان','جوز هند',

    'حليب','عسل','شوكولاتة','ساندويتش','فشار','مكرونة','تفاح مكرمل',

    // أدوات موسيقية
    'قيثارة','طبلة','بيانو','ميكروفون'
];

let usedWords = [];
function getRandomWords(count){
    let pool = WORD_BANK.filter(w => !usedWords.includes(w));
    if (pool.length < count){ usedWords = []; pool = WORD_BANK.slice(); }
    const picked = [];
    const poolCopy = pool.slice();
    for (let i = 0; i < count && poolCopy.length > 0; i++){
        const idx = Math.floor(Math.random() * poolCopy.length);
        picked.push(poolCopy.splice(idx, 1)[0]);
    }
    return picked;
}

// ===================== حالة اللعبة =====================
let settings = { duration: 90, rounds: 15, wordSource: 'custom' };
let currentRoundNum = 0;
let currentWord = '';
let roundActive = false;
let roundTimerInterval = null;
let roundStartTime = 0;
let correctGuessers = [];
let scores = {}; // id -> {name, score}
let soundOn = true;
let pusher = null, channel = null;

const setupScreen = document.getElementById('setupScreen');
const gameScreen = document.getElementById('gameScreen');
const sidePanel = document.getElementById('sidePanel');
const roundBadge = document.getElementById('roundBadge');
const timerText = document.getElementById('timerText');
const timerFill = document.getElementById('timerFill');
const countdownOverlay = document.getElementById('countdownOverlay');

const roundEndOverlay = document.getElementById('roundEndOverlay');
const roundEndWord = document.getElementById('roundEndWord');
const roundEndList = document.getElementById('roundEndList');
const camIdleState = document.getElementById('camIdleState');
const camWordInputState = document.getElementById('camWordInputState');
const camWordPickState = document.getElementById('camWordPickState');
const wordPickBtn1 = document.getElementById('wordPickBtn1');
const wordPickBtn2 = document.getElementById('wordPickBtn2');

// ===================== بدء اللعبة =====================
function startGame(){
    settings.duration = parseInt(document.getElementById('durationSelect').value, 10);
    settings.rounds = parseInt(document.getElementById('roundsSelect').value, 10);
    settings.wordSource = document.getElementById('wordSourceSelect').value;
    currentRoundNum = 0;
    scores = {};
    usedWords = [];
    renderLeaderboard();
    setupScreen.style.display = 'none';
    gameScreen.classList.add('show');
    startWordInputPhase();
}

function backToSetup(){
    clearInterval(roundTimerInterval);
    roundActive = false;
    gameScreen.classList.remove('show');
    setupScreen.style.display = 'block';
    camIdleState.style.display = 'block';
    camWordInputState.style.display = 'none';
    camWordPickState.style.display = 'none';
    camWordDisplayState.style.display = 'none';
}

// ===================== مرحلة اختيار/كتابة الكلمة =====================
function startWordInputPhase(){
    currentRoundNum++;
    if (currentRoundNum > settings.rounds){ endGame(); return; }

    roundBadge.textContent = `${currentRoundNum}/${settings.rounds}`;
    clearCanvas(false);
    disableCanvas(true);
    roundEndOverlay.classList.remove('show');
    timerFill.style.width = '100%';
    timerText.textContent = String(settings.duration).padStart(2,'0');

    camIdleState.style.display = 'none';
    camWordDisplayState.style.display = 'none';

    if (settings.wordSource === 'pick2'){
        camWordInputState.style.display = 'none';
        camWordPickState.style.display = 'block';
        showWordPickPhase();
    } else {
        camWordPickState.style.display = 'none';
        camWordInputState.style.display = 'block';
        wordInput.value = '';
        wordInput.focus();
    }
}

wordInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmWord(); });

function confirmWord(){
    const w = wordInput.value.trim();
    if (!w){ alert('اكتب كلمة أول'); return; }
    currentWord = w;
    camWordInputState.style.display = 'none';
    startCountdown();
}

function showWordPickPhase(){
    const [w1, w2] = getRandomWords(2);
    wordPickBtn1.textContent = w1;
    wordPickBtn2.textContent = w2;
    wordPickBtn1.onclick = () => selectPickedWord(w1);
    wordPickBtn2.onclick = () => selectPickedWord(w2);
}

function selectPickedWord(w){
    usedWords.push(w);
    currentWord = w;
    camWordPickState.style.display = 'none';
    startCountdown();
}

// ===================== العد التنازلي =====================
function startCountdown(){
    let n = 3;
    countdownOverlay.classList.add('show');
    countdownNum.textContent = n;
    playTick();
    const iv = setInterval(() => {
        n--;
        if (n <= 0){
            clearInterval(iv);
            countdownOverlay.classList.remove('show');
            beginRoundTimer();
            return;
        }
        countdownNum.textContent = n;
        countdownNum.style.animation = 'none';
        void countdownNum.offsetWidth;
        countdownNum.style.animation = 'pop 0.9s ease';
        playTick();
    }, 1000);
}

// ===================== تشغيل جولة الرسم =====================
function beginRoundTimer(){
    roundActive = true;
    correctGuessers = [];
    disableCanvas(false);
    clearCanvas(false);

    camWordDisplayState.style.display = 'block';
    currentWordDisplay.textContent = currentWord;

    roundStartTime = Date.now();
    const totalMs = settings.duration * 1000;

    roundTimerInterval = setInterval(() => {
        const elapsed = Date.now() - roundStartTime;
        const remaining = Math.max(0, totalMs - elapsed);
        timerText.textContent = String(Math.ceil(remaining/1000)).padStart(2,'0');
        timerFill.style.width = (remaining/totalMs*100) + '%';
        if (remaining <= 0){
            clearInterval(roundTimerInterval);
            endRound();
        }
    }, 200);
}

function forceEndRound(){
    if (!roundActive) return;
    clearInterval(roundTimerInterval);
    endRound();
}

function endRound(){
    roundActive = false;
    disableCanvas(true);
    camWordDisplayState.style.display = 'none';
    camIdleState.style.display = 'block';

    roundEndWord.textContent = currentWord;
    if (correctGuessers.length === 0){
        roundEndList.innerHTML = '😅 محد جاوب هالجولة!';
    } else {
        roundEndList.innerHTML = correctGuessers
            .map(g => `✅ ${g.name} <b>(+${g.points})</b>`)
            .join('<br>');
    }
    roundEndOverlay.classList.add('show');
    nextRoundBtnLabel();
    playRoundEndSound();
}

function nextRoundBtnLabel(){
    const btn = document.getElementById('nextRoundBtn');
    btn.textContent = currentRoundNum >= settings.rounds ? '🏁 عرض النتيجة النهائية' : 'الجولة الجاية ▶️';

function proceedNextRound(){

    startWordInputPhase();
}

// ===================== نهاية اللعبة =====================
function endGame(){
    gameScreen.classList.remove('show');
    const sorted = Object.values(scores).sort((a,b) => b.score - a.score).slice(0, 10);
    const medal = ['🥇','🥈','🥉'];
    const rankClass = ['rank-gold','rank-silver','rank-bronze'];
    finishList.innerHTML = sorted.length
        ? sorted.map((s,i) => `
            <div class="finish-row ${rankClass[i] || ''}">

                <span class="finish-name">${s.name}</span>

// ===================== الليدر بورد =====================
function renderLeaderboard(){
    const list = document.getElementById('leaderboardList');
    const sorted = Object.values(scores).sort((a,b) => b.score - a.score).slice(0, 3);
    if (sorted.length === 0){
        list.innerHTML = '<div class="lb-empty">ما فيه نقاط بعد</div>';

}

// ===================== تخمين الشات =====================
function normalizeGuess(s){
    return (s || '').trim().toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/\s+/g, ' ');
}

function handleChatGuess(userId, username, rawMessage){
    if (!roundActive || !currentWord) return;
    if (normalizeGuess(rawMessage) !== normalizeGuess(currentWord)) return;

    // أول شخص يجاوب صح بس هو اللي ياخذ النقطة، وتنتهي الجولة فوراً
    correctGuessers.push({ id: userId, name: username, points: 1 });

    if (!scores[userId]) scores[userId] = { name: username, score: 0 };
    scores[userId].name = username;
    scores[userId].score += 1;

    renderLeaderboard();
    playCorrectDing();
    addLog(`✅ ${username} جاوب صح أول واحد! (+1)`);

    clearInterval(roundTimerInterval);
    endRound();
}

// ===================== الرسم =====================
const canvas = document.getElementById('drawCanvas');
const cctx = canvas.getContext('2d', { willReadFrequently: true });
let currentTool = 'pen';
let currentColor = '#111111';
let brushSize = 6;
let isDrawing = false;
let lastX = 0, lastY = 0;
let undoStack = [];
let redoStack = [];

function clearCanvas(saveUndo){
    if (saveUndo) pushUndo();
    cctx.fillStyle = '#ffffff';
    cctx.fillRect(0, 0, canvas.width, canvas.height);
}
clearCanvas(false);

function disableCanvas(disabled){
    canvas.style.pointerEvents = disabled ? 'none' : 'auto';
    canvas.style.opacity = disabled ? '0.55' : '1';
}
disableCanvas(true);

function pushUndo(){
    try {
        undoStack.push(cctx.getImageData(0,0,canvas.width,canvas.height));
        if (undoStack.length > 25) undoStack.shift();
        redoStack = [];
    } catch(e){}
}
function undoStroke(){
    if (undoStack.length === 0) return;
    redoStack.push(cctx.getImageData(0,0,canvas.width,canvas.height));
    const prev = undoStack.pop();
    cctx.putImageData(prev, 0, 0);
}
function redoStroke(){
    if (redoStack.length === 0) return;
    undoStack.push(cctx.getImageData(0,0,canvas.width,canvas.height));
    const next = redoStack.pop();
    cctx.putImageData(next, 0, 0);
}

function setTool(tool){
    currentTool = tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('active');
}

document.getElementById('sizeSlider').addEventListener('input', (e) => { brushSize = parseInt(e.target.value, 10); });

const paletteColors = ['#111111','#ffffff','#9aa0b8','#3b82f6','#22c55e','#ef4444','#f97316','#eab308','#a855f7','#8b5e3c','#ffb6c1','#06b6d4'];
function renderSwatches(){
    const wrap = document.getElementById('swatches');
    wrap.innerHTML = '';
    paletteColors.forEach(c => {
        const sw = document.createElement('div');
        sw.className = 'swatch' + (c === currentColor ? ' active' : '');
        sw.style.background = c;
        sw.style.borderColor = c === '#ffffff' ? '#c9cede' : 'rgba(30,42,94,0.25)';
        sw.onclick = () => { currentColor = c; renderSwatches(); };
        wrap.appendChild(sw);
    });
    const custom = document.createElement('div');
    custom.className = 'swatch custom';
    custom.innerHTML = `<input type="color" value="${currentColor}">`;
    custom.querySelector('input').addEventListener('input', (e) => { currentColor = e.target.value; });
    wrap.appendChild(custom);
}
renderSwatches();

function getCanvasPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

canvas.addEventListener('pointerdown', (e) => {
    const { x, y } = getCanvasPos(e);
    if (currentTool === 'fill'){
        pushUndo();
        floodFill(Math.floor(x), Math.floor(y), currentColor);
        return;
    }
    pushUndo();
    isDrawing = true;
    lastX = x; lastY = y;
    cctx.beginPath();
    cctx.arc(x, y, brushSize/2, 0, Math.PI*2);
    cctx.fillStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
    cctx.fill();
});
canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    const { x, y } = getCanvasPos(e);
    cctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
    cctx.lineWidth = brushSize;
    cctx.lineCap = 'round';
    cctx.lineJoin = 'round';
    cctx.beginPath();
    cctx.moveTo(lastX, lastY);
    cctx.lineTo(x, y);
    cctx.stroke();
    lastX = x; lastY = y;
});
window.addEventListener('pointerup', () => { isDrawing = false; });

function floodFill(startX, startY, fillColorHex){
    const w = canvas.width, h = canvas.height;
    if (startX < 0 || startY < 0 || startX >= w || startY >= h) return;
    const img = cctx.getImageData(0, 0, w, h);
    const data = img.data;
    const idx = (x,y) => (y*w+x)*4;

    const r = parseInt(fillColorHex.slice(1,3),16);
    const g = parseInt(fillColorHex.slice(3,5),16);
    const b = parseInt(fillColorHex.slice(5,7),16);

    const startIdx = idx(startX, startY);
    const sr = data[startIdx], sg = data[startIdx+1], sb = data[startIdx+2], sa = data[startIdx+3];
    if (sr === r && sg === g && sb === b) return;

    const tol = 40;
    function matches(i){
        return Math.abs(data[i]-sr) <= tol && Math.abs(data[i+1]-sg) <= tol &&
               Math.abs(data[i+2]-sb) <= tol && Math.abs(data[i+3]-sa) <= tol;
    }

    const stack = [[startX, startY]];
    const visited = new Uint8Array(w*h);
    while (stack.length){
        const [x,y] = stack.pop();
        if (x<0||y<0||x>=w||y>=h) continue;
        const p = y*w+x;
        if (visited[p]) continue;
        const i = p*4;
        if (!matches(i)) continue;
        visited[p] = 1;
        data[i]=r; data[i+1]=g; data[i+2]=b; data[i+3]=255;
        stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    cctx.putImageData(img, 0, 0);
}

// ===== حفظ الحجم الابتدائي لفرشاة القلم =====
setTool('pen');

// ===================== أصوات مدمجة =====================
function toggleSound(){
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
}
function beep(freq, dur, type){
    if (!soundOn) return;
    try {
        const ac = new (window.AudioContext||window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, ac.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ac.currentTime+0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
        osc.connect(gain); gain.connect(ac.destination);
        osc.start(); osc.stop(ac.currentTime+dur+0.02);
    } catch(e){}
}
function playTick(){ beep(600, 0.15, 'square'); }
function playCorrectDing(){ beep(1200, 0.18, 'triangle'); }
function playRoundEndSound(){ beep(400, 0.3, 'sawtooth'); }
function playFanfare(){
    if (!soundOn) return;
    [660,880,1100,1320].forEach((f,i) => setTimeout(() => beep(f,0.3,'triangle'), i*120));
}

// ===================== الاتصال بشات كيك =====================
function connectToChat(){
    const chatroomId = document.getElementById('chatroomInput').value.trim();
    const channelName = document.getElementById('channelNameInput').value.trim() || `غرفة #${chatroomId}`;
    if (!chatroomId){ alert('اكتب رقم غرفة الشات أول'); return; }
    try {
        localStorage.setItem('zlf_dg_chatroom_id', chatroomId);
        localStorage.setItem('zlf_dg_channel_name', channelName);
    } catch(e){}
    connectPusher(chatroomId, channelName);
}

function connectPusher(chatroomId, channelName){
    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const displayName = channelName || `غرفة #${chatroomId}`;

    statusPill.className = 'status-pill pending';
    statusText.textContent = 'جاري الاتصال...';

    if (pusher) pusher.disconnect();
    pusher = new Pusher('32cbd69e4b950bf97679', { cluster: 'us2' });
    channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);

    channel.bind('App\\Events\\ChatMessageEvent', function(data){
        const rawMessage = (data.content || '').trim();
        const username = data.sender ? data.sender.username : 'مجهول';
        const userId = data.sender ? data.sender.id : username;
        handleChatGuess(userId, username, rawMessage);
    });

    pusher.connection.bind('connected', () => {
        statusPill.className = 'status-pill online';
        statusText.textContent = `متصل — ${displayName}`;
    });
    pusher.connection.bind('error', () => {
        statusPill.className = 'status-pill offline';
        statusText.textContent = 'خطأ بالاتصال';
    });
}
