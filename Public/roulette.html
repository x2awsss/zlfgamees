<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الروليت الروسي | عالم زلف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        html, body { height: 100%; overflow: hidden; overflow-x: hidden !important; max-width: 100vw; }

        body {
            background-color: #050816;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            padding: 15px 24px 12px;
            position: relative;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== تصميم البار الموحد ===== */
        .navbar {
            width: 85%;
            max-width: 1200px;
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            background: rgba(10, 17, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            margin-top: 5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            overflow: hidden;
            border: 1.5px solid rgba(59, 130, 246, 0.8);
        }

        .nav-logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffffff, #c3dafe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .nav-home-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .nav-home-btn svg {
            stroke: #fff;
        }

        .nav-center-title {
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffffff, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(248, 113, 113, 0.15);
        }

        .auth-area {
            display: flex;
            align-items: center;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 50px;
            z-index: 2;
        }
        .status-pill.offline { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
        .status-pill.online { background: rgba(83,252,24,0.1); color: #53fc18; border: 1px solid rgba(83,252,24,0.4); }
        .status-pill.pending { background: rgba(234,179,8,0.1); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

        .connect-bar {
            position: fixed;
            bottom: 14px;
            right: 14px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(10, 17, 40, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 6px;
            z-index: 50;
        }
        .connect-bar input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.72rem;
            outline: none;
            width: 88px;
        }
        .connect-bar input::placeholder { color: #6b7280; }
        .connect-bar button {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.72rem;
            transition: 0.3s;
            white-space: nowrap;
        }
        .connect-bar button:hover { transform: scale(1.05); }

        /* ===================== شاشة الإعداد ===================== */
        #setupScreen {
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 90px);
            overflow-y: auto;
            background: #0f1420;
            border: 1.5px solid #eab308;
            border-radius: 22px;
            padding: 24px 30px;
            text-align: center;
            z-index: 2;
            margin: auto 0; 
        }

        .setup-title { font-size: 1rem; font-weight: 900; color: #eab308; margin-bottom: 16px; }

        .setup-label {
            font-size: 0.85rem;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .setup-label .qmark {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 1px solid #6b7280;
            color: #6b7280;
            font-size: 0.65rem;
            display: flex; align-items: center; justify-content: center;
        }

        .counter-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .counter-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
        }
        .counter-btn:hover { background: rgba(255,255,255,0.12); }
        .counter-value {
            width: 50px; height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
            font-size: 1.05rem;
        }

        .chamber-preview { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
        .chamber-preview .dot { width: 12px; height: 12px; border-radius: 50%; }
        .chamber-preview .dot.g { background: #53fc18; box-shadow: 0 0 6px rgba(83,252,24,0.5); }
        .chamber-preview .dot.r { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }

        .join-hint { font-size: 0.8rem; color: #929dae; margin-bottom: 14px; }
        .join-hint b { color: #53fc18; }

        .pending-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
            max-height: 22vh;
            overflow-y: auto;
        }
        .pending-grid::-webkit-scrollbar { width: 4px; }
        .pending-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .pending-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .pending-chip .remove-x {
            background: rgba(248,113,113,0.15);
            color: #f87171;
            width: 20px; height: 20px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .pending-chip .k-icon {
            background: #53fc18;
            color: #000;
            width: 16px; height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pending-empty { grid-column: 1 / -1; color: #6b7280; font-size: 0.8rem; padding: 10px 0; }

        .start-game-btn {
            width: 100%;
            background: linear-gradient(135deg, #557bf7, #0d29b4);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .start-game-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,58,237,0.4); }

        /* ===================== شاشة اللعب ===================== */
        #gameScreen {
            display: none;
            width: 100%; max-width: 1000px;
            max-height: calc(100vh - 60px);
            overflow-y: hidden;
            z-index: 2;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            flex: 1 1 auto;
            min-height: 0;
        }
        #gameScreen.show { display: flex; }

        .top-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            padding: 11px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .action-btn.new-game { background: rgba(234,179,8,0.12); color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
        .action-btn.manage { background: rgba(59,130,246,0.12); color: #3b82f6; border: 1px solid rgba(59,130,246,0.4); }
        .action-btn.spin { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; box-shadow: 0 0 20px rgba(124,58,237,0.4); }
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .game-columns {
            display: flex;
            gap: clamp(16px, 4vw, 80px);
            width: 100%;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: nowrap;
            overflow-x: hidden;
            margin-top: auto;
            margin-bottom: auto;
        }

        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        /* صندوق قائمة اللاعبين */
        .players-panel {
            background: rgba(15, 20, 32, 0.5);
            border: 1.5px solid rgba(83,252,24,0.35);
            border-radius: 20px;
            padding: 16px;
            width: auto;
            flex: 1 1 220px;
            min-width: 0;
            max-width: 720px;
            min-height: min(460px, 56vh);
            display: flex;
            flex-direction: column;
        }

        .fancy-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            overflow-y: auto;
            align-content: start;
        }
        .fancy-grid::-webkit-scrollbar { width: 4px; }
        .fancy-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        
        /* ⭐ كود الكروت المعدل لإصلاح محاذاة الأسماء ومنع خروجها ⭐ */
        .fancy-chip {
            background: rgba(15, 20, 32, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.3s;
            overflow: hidden !important;
            width: 100% !important;
        }
        .fancy-chip.dead { opacity: 0.35; }
        .fancy-chip.chooser { border-color: #eab308; box-shadow: 0 0 12px rgba(234,179,8,0.35); }
        .fancy-chip.targeted { border-color: #f87171; box-shadow: 0 0 12px rgba(248,113,113,0.4); }

        .fancy-chip .top-row {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 6px !important;
            font-size: 0.85rem !important;
            font-weight: 800 !important;
            width: 100% !important;
            min-width: 0 !important;
            direction: ltr !important; /* ضمان الترتيب الأفقي بدون تداخل لليسار */
        }
        
        .fancy-chip .chip-name {
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            flex: 1 !important;
            min-width: 0 !important;
            text-align: left !important;
            color: #fff !important;
        }
        
        .fancy-chip .num-badge-mini {
            color: #6b7280;
            font-size: 0.72rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .fancy-chip .k-icon {
            background: #53fc18;
            color: #000;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .fancy-chip .mini-dots {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .fancy-chip .mini-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.12); }
        .fancy-chip .mini-dots span.safe { background: #53fc18; }
        .fancy-chip .mini-dots span.dead-dot { background: #f87171; }

        /* عجلة الحظ */
        .wheel-wrapper { 
            position: relative; 
            width: min(440px, 50vh, 40vw); 
            height: min(440px, 50vh, 40vw); 
        }
        .pointer {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent; border-right: 14px solid transparent;
            border-top: 22px solid #eab308;
            z-index: 5;
            filter: drop-shadow(0 0 6px rgba(234,179,8,0.6));
        }
        #wheelCanvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 6px solid #1e293b;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.12, 0.94, 0.2, 1);
        }
        .empty-wheel-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #6b7280; font-size: 0.8rem; width: 180px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: #929dae;
            width: 100%;
            max-width: 280px;
        }
        .speed-control input[type="range"] {
            flex: 1;
            accent-color: #eab308;
        }
        .speed-control .speed-val { color: #eab308; font-weight: 900; min-width: 16px; text-align: center; }

        /* ===================== نوافذ منبثقة ===================== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .overlay.show { display: flex; }

        .modal-card {
            background: #0f1420;
            border: 1.5px solid #eab308;
            border-radius: 24px;
            padding: 38px 42px;
            text-align: center;
            max-width: 560px; width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 40px rgba(234,179,8,0.15);
            animation: popIn 0.35s ease;
        }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-eyebrow { color: #eab308; font-size: 0.95rem; margin-bottom: 12px; opacity: 0.85; }
        .modal-big-name { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 18px; }
        .modal-instr { color: #929dae; font-size: 0.92rem; margin-bottom: 24px; }

        .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
        .picker-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 10px; border-radius: 12px;
            font-family: inherit; font-size: 0.88rem; font-weight: 700;
            cursor: pointer; transition: 0.25s;
        }
        .picker-btn:hover { border-color: #eab308; background: rgba(234,179,8,0.1); transform: translateY(-2px); }
        .num-badge {
            background: rgba(83,252,24,0.15); color: #53fc18;
            font-size: 0.72rem; font-weight: 900;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .modal-close-btn {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border: none; color: #fff; padding: 12px 40px; border-radius: 50px;
            font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.95rem;
        }

        .shoot-scene {
            display: flex; align-items: center; justify-content: center;
            gap: 30px; height: 110px; margin-bottom: 18px; position: relative;
            overflow: visible;
        }
        .shoot-scene.shake { animation: screenShake 0.4s ease; }
        @keyframes screenShake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-7px,3px) rotate(-1.2deg); }
            40% { transform: translate(6px,-4px) rotate(1.2deg); }
            60% { transform: translate(-5px,4px) rotate(-1deg); }
            80% { transform: translate(3px,-2px) rotate(0.6deg); }
        }

            background-repeat: no-repeat;

        }
        .gun-icon.recoil-strong { animation: strongRecoil 0.28s cubic-bezier(.2,.9,.3,1); }
        .gun-icon.sprite-fire { animation: gunSpriteFire 0.5s steps(1) both; }
        @keyframes gunSpriteFire {
            0%    { background-position: 0% 0%; }
            16.6% { background-position: 20% 0%; }
            33.3% { background-position: 40% 0%; }
            50%   { background-position: 60% 0%; }
            66.6% { background-position: 80% 0%; }
            83.3% { background-position: 100% 0%; }
            100%  { background-position: 0% 0%; }
        }
        @keyframes strongRecoil {
            0%   { transform: scaleX(1) translateX(0) rotate(0deg); }
            22%  { transform: scaleX(1) translateX(-20px) rotate(-16deg); }
            55%  { transform: scaleX(1) translateX(5px) rotate(5deg); }
            100% { transform: scaleX(1) translateX(0) rotate(0deg); }
        }
        .muzzle-flash {
            position: absolute; width: 46px; height: 46px; border-radius: 50%;
            left: 38%; top: 46%; transform: translate(-50%,-50%) scale(0.2);
            background: radial-gradient(circle, #ffffff 0%, #ffd23f 30%, #f97316 60%, transparent 78%);
            opacity: 0; pointer-events: none; z-index: 4;
        }
        .muzzle-flash.flash { animation: muzzleFlash 0.2s ease-out; }
        @keyframes muzzleFlash {
            0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.15) rotate(0deg); }
            30%  { opacity: 1; transform: translate(-50%,-50%) scale(1.35) rotate(20deg); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(1.8) rotate(35deg); }
        }
        .target-char { width: 70px; height: 96px; transition: transform 0.4s ease, opacity 0.4s ease; position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: center; }
        .target-char svg { width: 100%; height: 100%; overflow: visible; }
        .target-char.flinch { animation: flinch 0.35s ease; }
        .target-char.fallen { animation: strongFall 0.65s cubic-bezier(.36,.07,.19,.97) forwards; }
        @keyframes flinch {
            0% { transform: translateX(0); }
            30% { transform: translateX(6px) rotate(6deg); }
            60% { transform: translateX(-4px) rotate(-4deg); }
            100% { transform: translateX(0) rotate(0); }
        }
        @keyframes strongFall {
            0%   { transform: rotate(0deg) translateY(0) scale(1); opacity: 1; }
            25%  { transform: rotate(-12deg) translateY(-10px) scale(1.08); opacity: 1; }
            55%  { transform: rotate(55deg) translateY(4px) scale(0.98); opacity: 0.9; }
            100% { transform: rotate(88deg) translateY(14px) scale(0.9); opacity: 0.4; }
        }
        .blood-particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            background: #c0132b; pointer-events: none; opacity: 1; z-index: 5;
            box-shadow: 0 0 5px rgba(192,19,43,0.7);
        }
        @keyframes bloodFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.25); opacity: 0; }
        }
        .bullet-fx {
            position: absolute; top: 50%; left: 40%;
            width: 10px; height: 4px; border-radius: 4px;
            background: #eab308; opacity: 0;
            box-shadow: 0 0 8px #eab308;
        }
        .bullet-fx.fire { animation: bulletFly 0.25s linear forwards; }
        @keyframes bulletFly {
            0% { opacity: 1; left: 40%; }
            100% { opacity: 0; left: 65%; }
        }

        .chambers { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .chamber-dot {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .chamber-dot.used-safe { background: #53fc18; border-color: #53fc18; }
        .chamber-dot.used-dead { background: #f87171; border-color: #f87171; }

        .result-msg { font-size: 1.25rem; font-weight: 900; min-height: 34px; }
        .result-msg.dead { color: #f87171; }
        .result-msg.alive { color: #53fc18; }

        @media (max-width: 560px) {
            .picker-grid, .pending-grid { grid-template-columns: repeat(2, 1fr); }
            .fancy-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-big-name { font-size: 1.5rem; }
            .wheel-wrapper { width: 260px; height: 260px; }
            .game-columns { flex-wrap: wrap; }
        }

        /* إخفاء السكرول بار نهائياً */
        html, body, * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        html, body {
            overflow: hidden !important;
        }
    </style>

        let sharedAudioCtx = null;
        let gunshotBuffer = null;
        let gunshotLoadingPromise = null;

        function getSharedAudioCtx() {
            if (!sharedAudioCtx) {
                sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sharedAudioCtx.state === 'suspended') {
                sharedAudioCtx.resume().catch(() => {});
            }
            return sharedAudioCtx;
        }

        function preloadGunshotSound() {
            if (gunshotLoadingPromise) return gunshotLoadingPromise;
            gunshotLoadingPromise = (async () => {
                try {
                    const ctx = getSharedAudioCtx();
                    const res = await fetch(GUNSHOT_SOUND_B64);
                    const arrayBuffer = await res.arrayBuffer();
                    gunshotBuffer = await ctx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.warn('تعذر تحميل صوت الطلقة الحقيقي مسبقاً، بيتم استخدام صوت بديل', e);
                }
            })();
            return gunshotLoadingPromise;
        }

        // نبدأ التحميل فوراً من فتح الصفحة
        preloadGunshotSound();
        // وأيضاً عند أول تفاعل من المستخدم (بعض المتصفحات ما تسمح بتشغيل الصوت قبل أول ضغطة)
        document.addEventListener('pointerdown', () => { getSharedAudioCtx(); preloadGunshotSound(); }, { once: true });

        const manageOverlay = document.getElementById('manageOverlay');
        const manageGrid = document.getElementById('manageGrid');

        const wheelColors = ['#3b82f6', '#eab308', '#f87171', '#53fc18', '#a855f7', '#06b6d4', '#f97316', '#ec4899'];

        function addLog(text) {
            console.log(text);
        }

        // ===================== شاشة الإعداد =====================
        function changeShotsCount(delta) {
            shotsPerPlayer = Math.min(5, Math.max(1, shotsPerPlayer + delta));
            shotsCountDisplay.textContent = shotsPerPlayer;
            renderChamberPreview();
        }

        function renderChamberPreview() {
            chamberPreview.innerHTML = '';
            for (let i = 0; i < shotsPerPlayer; i++) {
                const d = document.createElement('div');
                d.className = 'dot g';
                chamberPreview.appendChild(d);
            }
            const bulletDot = document.createElement('div');
            bulletDot.className = 'dot r';
            chamberPreview.appendChild(bulletDot);
        }

        function renderPendingGrid() {
            if (players.length === 0) {
                pendingGrid.innerHTML = '<div class="pending-empty">بانتظار أول مشارك...</div>';
                return;
            }
            pendingGrid.innerHTML = '';
            players.forEach(p => {
                const chip = document.createElement('div');
                chip.className = 'pending-chip';
                chip.innerHTML = `
                    <span class="remove-x" onclick="removePlayer('${p.id}')">✕</span>
                    <span class="k-icon">K</span>
                    <span>${p.name}</span>
                `;
                pendingGrid.appendChild(chip);
            });
        }

        function removePlayer(id) {
            players = players.filter(p => String(p.id) !== String(id));
            renderPendingGrid();
            if (gameStarted) { renderFancyGrid(); drawWheel(); }
        }

        function addPlayer(name, id) {
            if (gameStarted) return;
            if (players.some(p => p.id === id)) return;
            const player = { id, name, number: nextNumber++, bulletPosition: null, shotCount: 0, dead: false };
            players.push(player);
            addLog(`👋 #${player.number} ${name} انضم للعبة`);
            renderPendingGrid();
        }

        function startGame() {
            if (players.length < 1) {
                alert('لازم ينضم مشارك واحد على الأقل أول');
                return;
            }
            gameStarted = true;
            setupScreen.style.display = 'none';
            gameScreen.classList.add('show');
            renderFancyGrid();
            drawWheel();
        }

        function newGame() {
            players = [];
            chooser = null;
            currentTarget = null;
            waitingForPick = false;
            gameStarted = false;
            nextNumber = 1;
            totalRotation = 0;
            wheelCanvas.style.transitionDuration = '0s';
            wheelCanvas.style.transform = 'rotate(0deg)';
            gameScreen.classList.remove('show');
            setupScreen.style.display = 'block';
            renderPendingGrid();
            addLog('🆕 بدأت جولة جديدة');
        }

        // ===================== شبكة اللاعبين =====================
        function renderFancyGrid() {
            fancyGrid.innerHTML = '';
            players.forEach(p => {
                const chip = document.createElement('div');
                let cls = 'fancy-chip';
                if (p.dead) cls += ' dead';
                if (chooser && p.id === chooser.id) cls += ' chooser';
                if (currentTarget && p.id === currentTarget.id) cls += ' targeted';
                chip.className = cls;

                let dotsHtml = '';
                for (let i = 1; i <= shotsPerPlayer; i++) {
                    let dotCls = '';
                    if (i <= p.shotCount) {
                        dotCls = (i === p.bulletPosition) ? 'dead-dot' : 'safe';
                    }
                    dotsHtml += `<span class="${dotCls}"></span>`;
                }

                chip.innerHTML = `
                    <div class="top-row">
                        <span class="num-badge-mini">#${p.number}</span>
                        <span class="chip-name">${p.dead ? '💀 ' + p.name : p.name}</span>
                        <span class="k-icon">K</span>
                    </div>
                    <div class="mini-dots">${dotsHtml}</div>
                `;
                fancyGrid.appendChild(chip);
            });
            spinBtn.disabled = players.filter(p => !p.dead).length < 1 || isSpinning || waitingForPick;
        }

        // ===================== إدارة اللاعبين =====================
        function openManage() {
            manageGrid.innerHTML = '';
            players.forEach(p => {
                const chip = document.createElement('div');
                chip.className = 'pending-chip';
                chip.innerHTML = `
                    <span class="remove-x" onclick="removePlayer('${p.id}'); openManage();">✕</span>
                    <span class="k-icon">K</span>
                    <span>#${p.number} ${p.name}${p.dead ? ' ' : ''}</span>
                `;
                manageGrid.appendChild(chip);
            });
            if (players.length === 0) {
                manageGrid.innerHTML = '<div class="pending-empty">ما فيه مشاركين</div>';
            }
            manageOverlay.classList.add('show');
        }
        function closeManage() { manageOverlay.classList.remove('show'); }

        // ===================== رسم عجلة الحظ =====================
        function drawWheel() {
            const alive = players.filter(p => !p.dead);
            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

            if (alive.length === 0) {
                emptyWheelMsg.textContent = 'لا يوجد مشاركين أحياء';
                return;
            }
            emptyWheelMsg.textContent = '';

            const cx = wheelCanvas.width / 2;
            const cy = wheelCanvas.height / 2;
            const radius = wheelCanvas.width / 2 - 8;
            const sliceAngle = (2 * Math.PI) / alive.length;

            alive.forEach((p, i) => {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = wheelColors[i % wheelColors.length];
                ctx.fill();
                ctx.strokeStyle = '#050816';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#050816';
                ctx.font = 'bold 19px Cairo, sans-serif';
                const label = `#${p.number} ${p.name}`;
                const shortLabel = label.length > 16 ? label.slice(0, 15) + '…' : label;
                ctx.fillText(shortLabel, radius - 16, 6);
                ctx.restore();
            });
        }

        // ===================== لف العجلة =====================
        function spinWheel() {
            const alive = players.filter(p => !p.dead);
            if (alive.length === 0 || isSpinning) return;

            isSpinning = true;
            spinBtn.disabled = true;
            currentTarget = null;

            const speedValue = parseInt(document.getElementById('speedSlider').value, 10);
            const duration = 7.4 - (speedValue * 0.56);

            const sliceAngle = 360 / alive.length;
            const randomIndex = Math.floor(Math.random() * alive.length);

            const desiredLanding = (270 - (randomIndex * sliceAngle + sliceAngle / 2) + 360) % 360;
            const currentMod = ((totalRotation % 360) + 360) % 360;
            const extraTurns = 5 + Math.floor(Math.random() * 3);
            const delta = (desiredLanding - currentMod + 360) % 360;

            totalRotation += extraTurns * 360 + delta;

            wheelCanvas.style.transitionDuration = duration + 's';
            wheelCanvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                chooser = alive[randomIndex];
                isSpinning = false;
                startPickingPhase();
                renderFancyGrid();
            }, duration * 1000 + 150);
        }

        // ===================== اختيار الضحية =====================
        function startPickingPhase() {
            waitingForPick = true;
            pickerChooserName.textContent = chooser.name;
            renderPickerGrid();
            pickerOverlay.classList.add('show');
            addLog(`🎡 العجلة اختارت #${chooser.number} ${chooser.name}`);
            renderFancyGrid();
        }

        function renderPickerGrid() {
            pickerGrid.innerHTML = '';
            players.filter(p => !p.dead).forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'picker-btn';
                btn.innerHTML = `<span class="num-badge">${p.number}</span> ${p.name}`;
                btn.onclick = () => {
                    if (!waitingForPick) return;
                    handleChatPick(chooser.id, chooser.name, String(p.number));
                };
                pickerGrid.appendChild(btn);
            });
        }

        function closePicker() {
            pickerOverlay.classList.remove('show');
            waitingForPick = false;
            chooser = null;
            renderFancyGrid();
        }

        function handleChatPick(senderId, senderName, rawMessage) {
            if (!waitingForPick || !chooser) return;
            if (senderId !== chooser.id) return;

            const msg = rawMessage.trim().toLowerCase();
            let picked = null;

            if (/^\d+$/.test(msg)) {
                const num = parseInt(msg, 10);
                picked = players.find(p => p.number === num && !p.dead);
            }
            if (!picked) {
                picked = players.find(p => !p.dead && p.name.toLowerCase() === msg);
            }
            if (!picked) return;

            waitingForPick = false;
            pickerOverlay.classList.remove('show');
            openShootOverlay(picked);
        }

        // ===================== نافذة الإطلاق =====================
        function openShootOverlay(target) {
            currentTarget = target;
            if (currentTarget.bulletPosition === null) {
                currentTarget.bulletPosition = Math.floor(Math.random() * shotsPerPlayer) + 1;
            }
            renderFancyGrid();
            addLog(`🔫 #${chooser.number} ${chooser.name} اختار يطلق على #${target.number} ${target.name}`);

            shootTargetName.textContent = `#${target.number} ${target.name}`;
            shootSubtitle.textContent = `المسدس فيه ${shotsPerPlayer} خانات، رصاصة وحدة موزعة عشوائياً`;
            targetChar.innerHTML = STICK_FIGURE_ALIVE;
            targetChar.className = 'target-char';
            resultMsg.textContent = '';
            resultMsg.className = 'result-msg';
            shootCloseBtn.style.display = 'none';
            renderChambers();

            shootOverlay.classList.add('show');
            setTimeout(() => fireShot(), 1300);
        }

        function closeShootOverlay() {
            shootOverlay.classList.remove('show');
            chooser = null;
            currentTarget = null;
            renderFancyGrid();
            drawWheel();
        }

        function renderChambers() {
            chambersEl.innerHTML = '';
            for (let i = 1; i <= shotsPerPlayer; i++) {
                const dot = document.createElement('div');
                dot.className = 'chamber-dot';
                if (i <= currentTarget.shotCount) {
                    dot.classList.add(i === currentTarget.bulletPosition ? 'used-dead' : 'used-safe');
                }
                chambersEl.appendChild(dot);
            }
        }

        // ===== أصوات =====
        function playGunshotSound() {
            // إذا الصوت الحقيقي (shot.mp3) جاهز ومحمّل مسبقاً، شغّله فوراً بدون أي تأخير
            if (gunshotBuffer) {
                try {
                    const ctx = getSharedAudioCtx();
                    const source = ctx.createBufferSource();
                    source.buffer = gunshotBuffer;
                    const gain = ctx.createGain();
                    gain.gain.value = 1;
                    source.connect(gain);
                    gain.connect(ctx.destination);
                    source.start(0);
                    return;
                } catch (e) {
                    console.warn('فشل تشغيل صوت الطلقة الحقيقي، رجعنا للصوت البديل', e);
                }
            }

            // خطة بديلة (fallback): صوت مُصنّع، يُستخدم فقط لو ما تحمّل shot.mp3 بعد
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // ضجيج الطلقة الحادة
                const bufferSize = audioCtx.sampleRate * 0.35;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.08));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 2400;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start();

                // دفعة باص عميقة تحس فيها بوقع الطلقة
                const sub = audioCtx.createOscillator();
                const subGain = audioCtx.createGain();
                sub.type = 'sine';
                sub.frequency.setValueAtTime(130, audioCtx.currentTime);
                sub.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.22);
                subGain.gain.setValueAtTime(0.9, audioCtx.currentTime);
                subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
                sub.connect(subGain); subGain.connect(audioCtx.destination);
                sub.start(); sub.stop(audioCtx.currentTime + 0.3);

                // صدى خفيف بعد الطلقة مباشرة
                const echoNoise = audioCtx.createBufferSource();
                echoNoise.buffer = buffer;
                const echoFilter = audioCtx.createBiquadFilter();
                echoFilter.type = 'lowpass';
                echoFilter.frequency.value = 800;
                const echoGain = audioCtx.createGain();
                echoGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                echoGain.gain.setValueAtTime(0.22, audioCtx.currentTime + 0.1);
                echoGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
                echoNoise.connect(echoFilter); echoFilter.connect(echoGain); echoGain.connect(audioCtx.destination);
                echoNoise.start(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function playBodyFallSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(95, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(38, audioCtx.currentTime + 0.22);
                gain.gain.setValueAtTime(0.45, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        // رذاذ دم ستايلايزد بسيط (نقاط صغيرة تتطاير) بدون أي مشاهد فاجرة
        function spawnBloodParticles() {
            if (!shootScene) return;
            const originXPercent = 62, originYPercent = 50;
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'blood-particle';
                const angle = Math.random() * Math.PI * 2;
                const dist = 18 + Math.random() * 50;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist - 8;
                p.style.left = originXPercent + '%';
                p.style.top = originYPercent + '%';
                p.style.setProperty('--dx', dx + 'px');
                p.style.setProperty('--dy', dy + 'px');
                p.style.animation = `bloodFly ${0.45 + Math.random() * 0.3}s ease-out forwards`;
                shootScene.appendChild(p);
                setTimeout(() => p.remove(), 850);
            }
        }

        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [880, 1108, 1318, 1568];
                notes.forEach((freq, i) => {
                    const startTime = audioCtx.currentTime + i * 0.045;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);
                    gain.gain.setValueAtTime(0.001, startTime);
                    gain.gain.linearRampToValueAtTime(0.22, startTime + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.13);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(startTime); osc.stop(startTime + 0.14);
                });
            } catch (e) {}
        }

        // ===================== الإطلاق =====================
        function fireShot() {
            if (!currentTarget || currentTarget.dead) return;

            currentTarget.shotCount++;
            const isDead = currentTarget.shotCount === currentTarget.bulletPosition;

            gunIcon.classList.remove('recoil-strong');
            void gunIcon.offsetWidth;
            gunIcon.classList.add('recoil-strong');

            gunIcon.classList.remove('sprite-fire');
            void gunIcon.offsetWidth;
            gunIcon.classList.add('sprite-fire');

            if (isDead) {
                muzzleFlash.classList.remove('flash');
                void muzzleFlash.offsetWidth;
                muzzleFlash.classList.add('flash');

                bulletFx.classList.remove('fire');
                void bulletFx.offsetWidth;
                bulletFx.classList.add('fire');

                setTimeout(() => {
                    playGunshotSound();

                    if (shootScene) {
                        shootScene.classList.remove('shake');
                        void shootScene.offsetWidth;
                        shootScene.classList.add('shake');
                    }
                    spawnBloodParticles();

                    currentTarget.dead = true;
                    targetChar.innerHTML = STICK_FIGURE_DEAD;
                    targetChar.classList.add('fallen');
                    setTimeout(() => playBodyFallSound(), 380);

                    resultMsg.className = 'result-msg dead';
                    resultMsg.textContent = `💀 لقد مات ${currentTarget.name}!`;
                    addLog(`💀 #${currentTarget.number} ${currentTarget.name} مات بالمحاولة رقم ${currentTarget.shotCount}`);
                    renderChambers();
                    renderFancyGrid();
                    drawWheel();
                    shootCloseBtn.style.display = 'inline-block';
                }, 220);
            } else {
                playClickSound();
                targetChar.classList.add('flinch');
                setTimeout(() => targetChar.classList.remove('flinch'), 350);

                resultMsg.className = 'result-msg alive';
                resultMsg.textContent = `🎉 لقد نجا ${currentTarget.name}! (محاولة ${currentTarget.shotCount}/${shotsPerPlayer})`;
                addLog(`🎉 #${currentTarget.number} ${currentTarget.name} نجا بالمحاولة رقم ${currentTarget.shotCount}`);
                renderChambers();
                renderFancyGrid();
                shootCloseBtn.style.display = 'inline-block';
            }
        }

        // ===================== الاتصال بشات Kick =====================
        function connectToChat() {
            const idInput = document.getElementById('chatroomInput');
            const nameInput = document.getElementById('channelNameInput');
            const chatroomId = idInput.value.trim();
            const channelName = nameInput.value.trim() || `غرفة #${chatroomId}`;

            if (!chatroomId) {
                alert('اكتب رقم غرفة الشات (Chatroom ID) أول');
                return;
            }
            try {
                localStorage.setItem('zlf_chatroom_id', chatroomId);
                localStorage.setItem('zlf_channel_name', channelName);
            } catch (e) {}
            connectPusher(chatroomId, channelName);
        }

        function connectPusher(chatroomId, channelName) {
            const statusPill = document.getElementById('statusPill');
            const statusText = document.getElementById('statusText');
            const displayName = channelName || `غرفة #${chatroomId}`;

            statusPill.className = 'status-pill pending';
            statusText.textContent = 'جاري الاتصال بالشات...';

            if (pusher) pusher.disconnect();
            pusher = new Pusher('32cbd69e4b950bf97679', { cluster: 'us2' });
            channel = pusher.subscribe(`chatrooms.${chatroomId}.v2`);

            channel.bind('App\\Events\\ChatMessageEvent', function (data) {
                const rawMessage = (data.content || '').trim();
                const username = data.sender ? data.sender.username : 'مجهول';
                const userId = data.sender ? data.sender.id : username;

                addLog(`💬 [${username}]: ${rawMessage}`);

                if (rawMessage.toLowerCase() === 'join') {
                    addPlayer(username, userId);
                } else {
                    handleChatPick(userId, username, rawMessage);
                }
            });

            pusher.connection.bind('connected', () => {
                statusPill.className = 'status-pill online';
                statusText.textContent = `متصل — ${displayName}`;
                addLog(`✅ تم الاتصال بـ ${displayName}`);
            });

            pusher.connection.bind('error', (err) => {
                statusPill.className = 'status-pill offline';
                statusText.textContent = 'خطأ بالاتصال';
                addLog('⚠️ خطأ Pusher: ' + JSON.stringify(err));
            });
        }

        // ===================== البدء =====================
        renderChamberPreview();
        renderPendingGrid();

        try {
            const savedId = localStorage.getItem('zlf_chatroom_id');
            const savedName = localStorage.getItem('zlf_channel_name');
            if (savedId) {
                document.getElementById('chatroomInput').value = savedId;
                if (savedName) document.getElementById('channelNameInput').value = savedName;
                connectPusher(savedId, savedName);
            }
        } catch (e) {}
        setInterval(async () => {
          try {
            const res = await fetch('/api/check-ban-status');
            const data = await res.json();
            if (data.banned) {
              window.location.reload(); 
            }
          } catch (e) {}
        }, 3000);
    </script>
</body>
