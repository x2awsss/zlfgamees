<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الروليت الروسي | عالم زلف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <!-- مكتبة Twitch Chat (tmi.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tmi.js/1.8.5/tmi.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        html, body { height: 100%; overflow: hidden; overflow-x: hidden !important; max-width: 100vw; }

        body {
            background-color: #050816;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            padding: 15px 24px 12px;
            position: relative;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== تصميم البار الموحد ===== */
        .navbar {
            width: 85%;
            max-width: 1200px;
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            background: rgba(10, 17, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            margin-top: 5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            overflow: hidden;
            border: 1.5px solid rgba(59, 130, 246, 0.8);
        }

        .nav-logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffffff, #c3dafe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .nav-home-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .nav-home-btn svg {
            stroke: #fff;
        }

        .nav-center-title {
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffffff, #f87171);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(248, 113, 113, 0.15);
        }

        .auth-area {
            display: flex;
            align-items: center;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 50px;
            z-index: 2;
        }
        .status-pill.offline { background: rgba(248,113,113,0.1); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
        .status-pill.online { background: rgba(83,252,24,0.1); color: #53fc18; border: 1px solid rgba(83,252,24,0.4); }
        /* لون تويتش البنفسجي لحالة الاتصال */
        .status-pill.online-twitch { background: rgba(145,70,255,0.15); color: #a970ff; border: 1px solid rgba(145,70,255,0.4); }
        .status-pill.pending { background: rgba(234,179,8,0.1); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }

        .connect-bar {
            position: fixed;
            bottom: 14px;
            right: 14px;
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(10, 17, 40, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 6px;
            z-index: 50;
        }
        .connect-bar select, .connect-bar input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.72rem;
            outline: none;
        }
        .connect-bar select option { background: #0a1128; color: #fff; }
        .connect-bar input { width: 88px; }
        .connect-bar input::placeholder { color: #6b7280; }
        .connect-bar button {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            font-size: 0.72rem;
            transition: 0.3s;
            white-space: nowrap;
        }
        .connect-bar button:hover { transform: scale(1.05); }

        /* ===================== شاشة الإعداد ===================== */
        #setupScreen {
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 90px);
            overflow-y: auto;
            background: #0f1420;
            border: 1.5px solid #eab308;
            border-radius: 22px;
            padding: 24px 30px;
            text-align: center;
            z-index: 2;
            margin: auto 0; 
        }

        .setup-title { font-size: 1rem; font-weight: 900; color: #eab308; margin-bottom: 16px; }

        .setup-label {
            font-size: 0.85rem;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .setup-label .qmark {
            width: 16px; height: 16px;
            border-radius: 50%;
            border: 1px solid #6b7280;
            color: #6b7280;
            font-size: 0.65rem;
            display: flex; align-items: center; justify-content: center;
        }

        .counter-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .counter-btn {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
        }
        .counter-btn:hover { background: rgba(255,255,255,0.12); }
        .counter-value {
            width: 50px; height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900;
            font-size: 1.05rem;
        }

        .chamber-preview { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
        .chamber-preview .dot { width: 12px; height: 12px; border-radius: 50%; }
        .chamber-preview .dot.g { background: #53fc18; box-shadow: 0 0 6px rgba(83,252,24,0.5); }
        .chamber-preview .dot.r { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }

        .join-hint { font-size: 0.8rem; color: #929dae; margin-bottom: 14px; }
        .join-hint b { color: #53fc18; }

        .pending-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
            max-height: 22vh;
            overflow-y: auto;
        }
        .pending-grid::-webkit-scrollbar { width: 4px; }
        .pending-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .pending-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .pending-chip .remove-x {
            background: rgba(248,113,113,0.15);
            color: #f87171;
            width: 20px; height: 20px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .pending-chip .k-icon {
            background: #53fc18;
            color: #000;
            width: 16px; height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        /* أيقونة تويتش في القائمة */
        .pending-chip .t-icon {
            background: #9146FF;
            color: #fff;
            width: 16px; height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .pending-empty { grid-column: 1 / -1; color: #6b7280; font-size: 0.8rem; padding: 10px 0; }

        .start-game-btn {
            width: 100%;
            background: linear-gradient(135deg, #557bf7, #0d29b4);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .start-game-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,58,237,0.4); }

        /* ===================== شاشة اللعب ===================== */
        #gameScreen {
            display: none;
            width: 100%; max-width: 1000px;
            max-height: calc(100vh - 60px);
            overflow-y: hidden;
            z-index: 2;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            flex: 1 1 auto;
            min-height: 0;
        }
        #gameScreen.show { display: flex; }

        .top-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            padding: 11px 22px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .action-btn.new-game { background: rgba(234,179,8,0.12); color: #eab308; border: 1px solid rgba(234,179,8,0.4); }
        .action-btn.manage { background: rgba(59,130,246,0.12); color: #3b82f6; border: 1px solid rgba(59,130,246,0.4); }
        .action-btn.spin { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; box-shadow: 0 0 20px rgba(124,58,237,0.4); }
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .game-columns {
            display: flex;
            gap: clamp(16px, 4vw, 80px);
            width: 100%;
            align-items: flex-start;
            justify-content: center;
            flex-wrap: nowrap;
            overflow-x: hidden;
            margin-top: auto;
            margin-bottom: auto;
        }

        .wheel-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        /* صندوق قائمة اللاعبين */
        .players-panel {
            background: rgba(15, 20, 32, 0.5);
            border: 1.5px solid rgba(83,252,24,0.35);
            border-radius: 20px;
            padding: 16px;
            width: auto;
            flex: 1 1 220px;
            min-width: 0;
            max-width: 720px;
            min-height: min(460px, 56vh);
            display: flex;
            flex-direction: column;
        }

        .fancy-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            overflow-y: auto;
            align-content: start;
        }
        .fancy-grid::-webkit-scrollbar { width: 4px; }
        .fancy-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        
        .fancy-chip {
            background: rgba(15, 20, 32, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: 0.3s;
            overflow: hidden !important;
            width: 100% !important;
        }
        .fancy-chip.dead { opacity: 0.35; }
        .fancy-chip.chooser { border-color: #eab308; box-shadow: 0 0 12px rgba(234,179,8,0.35); }
        .fancy-chip.targeted { border-color: #f87171; box-shadow: 0 0 12px rgba(248,113,113,0.4); }

        .fancy-chip .top-row {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 6px !important;
            font-size: 0.85rem !important;
            font-weight: 800 !important;
            width: 100% !important;
            min-width: 0 !important;
            direction: ltr !important;
        }
        
        .fancy-chip .chip-name {
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
            flex: 1 !important;
            min-width: 0 !important;
            text-align: left !important;
            color: #fff !important;
        }
        
        .fancy-chip .num-badge-mini {
            color: #6b7280;
            font-size: 0.72rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        
        .fancy-chip .k-icon {
            background: #53fc18;
            color: #000;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .fancy-chip .t-icon {
            background: #9146FF;
            color: #fff;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .fancy-chip .mini-dots {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .fancy-chip .mini-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.12); }
        .fancy-chip .mini-dots span.safe { background: #53fc18; }
        .fancy-chip .mini-dots span.dead-dot { background: #f87171; }

        /* عجلة الحظ */
        .wheel-wrapper { 
            position: relative; 
            width: min(440px, 50vh, 40vw); 
            height: min(440px, 50vh, 40vw); 
        }
        .pointer {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent; border-right: 14px solid transparent;
            border-top: 22px solid #eab308;
            z-index: 5;
            filter: drop-shadow(0 0 6px rgba(234,179,8,0.6));
        }
        #wheelCanvas {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 6px solid #1e293b;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.12, 0.94, 0.2, 1);
        }
        .empty-wheel-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #6b7280; font-size: 0.8rem; width: 180px;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.78rem;
            color: #929dae;
            width: 100%;
            max-width: 280px;
        }
        .speed-control input[type="range"] {
            flex: 1;
            accent-color: #eab308;
        }
        .speed-control .speed-val { color: #eab308; font-weight: 900; min-width: 16px; text-align: center; }

        /* ===================== نوافذ منبثقة ===================== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .overlay.show { display: flex; }

        .modal-card {
            background: #0f1420;
            border: 1.5px solid #eab308;
            border-radius: 24px;
            padding: 38px 42px;
            text-align: center;
            max-width: 560px; width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 40px rgba(234,179,8,0.15);
            animation: popIn 0.35s ease;
        }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-eyebrow { color: #eab308; font-size: 0.95rem; margin-bottom: 12px; opacity: 0.85; }
        .modal-big-name { font-size: 2rem; font-weight: 900; color: #fff; margin-bottom: 18px; }
        .modal-instr { color: #929dae; font-size: 0.92rem; margin-bottom: 24px; }

        .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 26px; }
        .picker-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 10px; border-radius: 12px;
            font-family: inherit; font-size: 0.88rem; font-weight: 700;
            cursor: pointer; transition: 0.25s;
        }
        .picker-btn:hover { border-color: #eab308; background: rgba(234,179,8,0.1); transform: translateY(-2px); }
        .num-badge {
            background: rgba(83,252,24,0.15); color: #53fc18;
            font-size: 0.72rem; font-weight: 900;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .modal-close-btn {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border: none; color: #fff; padding: 12px 40px; border-radius: 50px;
            font-family: inherit; font-weight: 700; cursor: pointer; font-size: 0.95rem;
        }

        .shoot-scene {
            display: flex; align-items: center; justify-content: center;
            gap: 100px; height: 110px; margin-bottom: 18px; position: relative;
            overflow: visible;
        }
        .shoot-scene.shake { animation: screenShake 0.4s ease; }
        @keyframes screenShake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-7px,3px) rotate(-1.2deg); }
            40% { transform: translate(6px,-4px) rotate(1.2deg); }
            60% { transform: translate(-5px,4px) rotate(-1deg); }
            80% { transform: translate(3px,-2px) rotate(0.6deg); }
        }

            background-repeat: no-repeat;

        }
        .gun-icon.recoil-strong { animation: strongRecoil 0.28s cubic-bezier(.2,.9,.3,1); }
        .gun-icon.sprite-fire { animation: gunSpriteFire 0.5s steps(1) both; }
        @keyframes gunSpriteFire {
            0%    { background-position: 0% 0%; }
            16.6% { background-position: 20% 0%; }
            33.3% { background-position: 40% 0%; }
            50%   { background-position: 60% 0%; }
            66.6% { background-position: 80% 0%; }
            83.3% { background-position: 100% 0%; }
            100%  { background-position: 0% 0%; }
        }
        @keyframes strongRecoil {
            0%   { transform: scaleX(1) translateX(0) rotate(0deg); }
            22%  { transform: scaleX(1) translateX(-20px) rotate(-16deg); }
            55%  { transform: scaleX(1) translateX(5px) rotate(5deg); }
            100% { transform: scaleX(1) translateX(0) rotate(0deg); }
        }
        .muzzle-flash {
            position: absolute; width: 46px; height: 46px; border-radius: 50%;
            left: 38%; top: 46%; transform: translate(-50%,-50%) scale(0.2);
            background: radial-gradient(circle, #ffffff 0%, #ffd23f 30%, #f97316 60%, transparent 78%);
            opacity: 0; pointer-events: none; z-index: 4;
        }
        .muzzle-flash.flash { animation: muzzleFlash 0.2s ease-out; }
        @keyframes muzzleFlash {
            0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.15) rotate(0deg); }
            30%  { opacity: 1; transform: translate(-50%,-50%) scale(1.35) rotate(20deg); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(1.8) rotate(35deg); }
        }
        .target-char { width: 70px; height: 96px; transition: transform 0.4s ease, opacity 0.4s ease; position: relative; z-index: 2; display: flex; align-items: flex-end; justify-content: center; }
        .target-char svg { width: 100%; height: 100%; overflow: visible; }
        .target-char.flinch { animation: flinch 0.35s ease; }
        .target-char.fallen { animation: strongFall 0.65s cubic-bezier(.36,.07,.19,.97) forwards; }
        @keyframes flinch {
            0% { transform: translateX(0); }
            30% { transform: translateX(6px) rotate(6deg); }
            60% { transform: translateX(-4px) rotate(-4deg); }
            100% { transform: translateX(0) rotate(0); }
        }
        @keyframes strongFall {
            0%   { transform: rotate(0deg) translateY(0) scale(1); opacity: 1; }
            25%  { transform: rotate(-12deg) translateY(-10px) scale(1.08); opacity: 1; }
            55%  { transform: rotate(55deg) translateY(4px) scale(0.98); opacity: 0.9; }
            100% { transform: rotate(88deg) translateY(14px) scale(0.9); opacity: 0.4; }
        }
        .blood-particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            background: #c0132b; pointer-events: none; opacity: 1; z-index: 5;
            box-shadow: 0 0 5px rgba(192,19,43,0.7);
        }
        @keyframes bloodFly {
            0%   { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.25); opacity: 0; }
        }
        .bullet-fx {
            position: absolute; top: 50%; left: 40%;
            width: 10px; height: 4px; border-radius: 4px;
            background: #eab308; opacity: 0;
            box-shadow: 0 0 8px #eab308;
        }
        .bullet-fx.fire { animation: bulletFly 0.25s linear forwards; }
        @keyframes bulletFly {
            0% { opacity: 1; left: 40%; }
            100% { opacity: 0; left: 65%; }
        }

        .chambers { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .chamber-dot {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .chamber-dot.used-safe { background: #53fc18; border-color: #53fc18; }
        .chamber-dot.used-dead { background: #f87171; border-color: #f87171; }

        .result-msg { font-size: 1.25rem; font-weight: 900; min-height: 34px; }
        .result-msg.dead { color: #f87171; }
        .result-msg.alive { color: #53fc18; }

        @media (max-width: 560px) {
            .picker-grid, .pending-grid { grid-template-columns: repeat(2, 1fr); }
            .fancy-grid { grid-template-columns: repeat(2, 1fr); }
            .modal-big-name { font-size: 1.5rem; }
            .wheel-wrapper { width: 260px; height: 260px; }
            .game-columns { flex-wrap: wrap; }
        }

        html, body, * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        html, body {
            overflow: hidden !important;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="nav-right">
            <div class="nav-logo-icon">
                <img src="https://files.kick.com/images/user/1120744/profile_image/conversion/a86dc276-5226-4cae-89a3-bd7c3389f7f2-fullsize.webp" alt="ZLF Logo">
            </div>
            <span class="nav-brand">عالم زلف</span>

            <a href="/" class="nav-home-btn" title="العودة للصفحة الرئيسية">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </a>
        </div>

        <div class="nav-center-title">
            الروليت الروسي 🔫
        </div>

        <div class="auth-area">
            <div class="status-pill offline" id="statusPill">
                <span class="status-dot"></span>
                <span id="statusText">غير متصل</span>
            </div>
        </div>
    </nav>

    <div class="connect-bar" id="connectBar">
        <select id="platformSelect" onchange="togglePlatformInputs()">
            <option value="kick">Kick</option>
            <option value="twitch">Twitch</option>
        </select>
        <input type="text" id="channelNameInput" placeholder="اسم القناة">
        <input type="text" id="chatroomInput" placeholder="رقم غرفة الشات">
        <button onclick="connectToChat()">اتصال بالشات</button>
    </div>

    <!-- ===================== شاشة بدء اللعبة ===================== -->
    <div id="setupScreen">
        <div class="setup-title">بدء اللعبة</div>

        <div class="setup-label">
            عدد الضربات لكل لاعب (1-5)
            <span class="qmark">؟</span>
        </div>
        <div class="counter-row">
            <button class="counter-btn" onclick="changeShotsCount(1)">+</button>
            <div class="counter-value" id="shotsCountDisplay">5</div>
            <button class="counter-btn" onclick="changeShotsCount(-1)">-</button>
        </div>
        <div class="chamber-preview" id="chamberPreview"></div>

        <div class="join-hint">اكتب <b>"join"</b> في الشات للانضمام</div>

        <div class="pending-grid" id="pendingGrid">
            <div class="pending-empty">بانتظار أول مشارك...</div>
        </div>

        <button class="start-game-btn" onclick="startGame()">ابدأ اللعبة</button>
    </div>

    <!-- ===================== شاشة اللعب ===================== -->
    <div id="gameScreen">
        <div class="top-actions">
            <button class="action-btn new-game" onclick="newGame()">🆕 لعبة جديد</button>
            <button class="action-btn manage" onclick="openManage()">⚙️ إدارة اللاعبين</button>
        </div>

        <div class="game-columns">
            <div class="players-panel">
                <div class="fancy-grid" id="fancyGrid"></div>
            </div>

            <div class="wheel-col">
                <div class="speed-control">
                    <span>🐢 بطيء</span>
                    <input type="range" id="speedSlider" min="1" max="10" value="6" oninput="document.getElementById('speedVal').textContent = this.value">
                    <span>سريع 🐇</span>
                    <span class="speed-val" id="speedVal">6</span>
                </div>

                <div class="wheel-wrapper">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="420" height="420"></canvas>
                    <div class="empty-wheel-msg" id="emptyWheelMsg"></div>
                </div>

                <button class="action-btn spin" id="spinBtn" onclick="spinWheel()">🎡 لف العجلة</button>
            </div>
        </div>
    </div>

    <!-- ===================== نافذة اختيار الضحية ===================== -->
    <div class="overlay" id="pickerOverlay">
        <div class="modal-card">
            <div class="modal-eyebrow">وقع الاختيار على</div>
            <div class="modal-big-name" id="pickerChooserName">—</div>
            <div class="modal-instr">اختر لاعب لضربه، اكتب رقمه أو اسمه بالشات.</div>
            <div class="picker-grid" id="pickerGrid"></div>
            <button class="modal-close-btn" onclick="closePicker()">إغلاق</button>
        </div>
    </div>

    <!-- ===================== نافذة الإطلاق ===================== -->
    <div class="overlay" id="shootOverlay">
        <div class="modal-card">
            <div class="modal-eyebrow">🎯 الهدف</div>
            <div class="modal-big-name" id="shootTargetName">—</div>
            <div class="modal-instr" id="shootSubtitle">المسدس فيه خانات، رصاصة وحدة موزعة عشوائياً</div>

            <div class="shoot-scene">
                <span class="target-char" id="targetChar"></span>
                <div class="bullet-fx" id="bulletFx"></div>
                <div class="muzzle-flash" id="muzzleFlash"></div>
                <div class="gun-icon" id="gunIcon"></div>
            </div>

            <div class="chambers" id="chambers"></div>
            <div class="result-msg" id="resultMsg"></div>
            <button class="modal-close-btn" id="shootCloseBtn" onclick="closeShootOverlay()" style="margin-top:14px; display:none;">متابعة</button>
        </div>
    </div>

    <!-- ===================== نافذة إدارة اللاعبين ===================== -->
    <div class="overlay" id="manageOverlay">
        <div class="modal-card">
            <div class="modal-eyebrow">إدارة اللاعبين</div>
            <div class="pending-grid" id="manageGrid" style="margin-top: 10px;"></div>
            <button class="modal-close-btn" onclick="closeManage()" style="margin-top: 16px;">إغلاق</button>
        </div>
    </div>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#ffffff" },
                "opacity": { "value": 0.15 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 180, "opacity": 0.08 },
                "move": { "enable": true, "speed": 0.8 }
            }
        });

        const STICK_FIGURE_ALIVE = `<svg viewBox="0 0 70 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="35" cy="20" r="18" stroke="#ffffff" stroke-width="3" fill="none"/>
            <line x1="24" y1="17" x2="30" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="40" y1="17" x2="46" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="28" y1="27" x2="42" y2="27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="35" y1="38" x2="35" y2="72" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="35" y1="46" x2="14" y2="68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="46" x2="56" y2="68" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="72" x2="17" y2="98" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="72" x2="53" y2="98" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        </svg>`;
        const STICK_FIGURE_DEAD = `<svg viewBox="0 0 70 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="35" cy="20" r="18" stroke="#f87171" stroke-width="3" fill="none"/>
            <line x1="24" y1="14" x2="30" y2="20" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="30" y1="14" x2="24" y2="20" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="40" y1="14" x2="46" y2="20" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="46" y1="14" x2="40" y2="20" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="30" y1="29" x2="40" y2="26" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="35" y1="38" x2="35" y2="72" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="35" y1="46" x2="14" y2="68" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="46" x2="56" y2="68" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="72" x2="17" y2="98" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
            <line x1="35" y1="72" x2="53" y2="98" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
        </svg>`;

        let players = [];
        let chooser = null;
        let currentTarget = null;
        let isSpinning = false;
        let waitingForPick = false;
        let gameStarted = false;
        let shotsPerPlayer = 5;
        let nextNumber = 1;
        let totalRotation = 0;

        let pusher = null;
        let channel = null;
        let twitchClient = null; // عميل تويتش

        const pendingGrid = document.getElementById('pendingGrid');
        const chamberPreview = document.getElementById('chamberPreview');
        const shotsCountDisplay = document.getElementById('shotsCountDisplay');
        const setupScreen = document.getElementById('setupScreen');
        const gameScreen = document.getElementById('gameScreen');
        const fancyGrid = document.getElementById('fancyGrid');
        const spinBtn = document.getElementById('spinBtn');
        const wheelCanvas = document.getElementById('wheelCanvas');
        const emptyWheelMsg = document.getElementById('emptyWheelMsg');
        const ctx = wheelCanvas.getContext('2d');

        const pickerOverlay = document.getElementById('pickerOverlay');
        const pickerChooserName = document.getElementById('pickerChooserName');
        const pickerGrid = document.getElementById('pickerGrid');

        const shootOverlay = document.getElementById('shootOverlay');
        const shootTargetName = document.getElementById('shootTargetName');
        const shootSubtitle = document.getElementById('shootSubtitle');
        const chambersEl = document.getElementById('chambers');
        const resultMsg = document.getElementById('resultMsg');
        const targetChar = document.getElementById('targetChar');
        const gunIcon = document.getElementById('gunIcon');
        const bulletFx = document.getElementById('bulletFx');
        const muzzleFlash = document.getElementById('muzzleFlash');
        const shootScene = document.querySelector('.shoot-scene');
        const shootCloseBtn = document.getElementById('shootCloseBtn');

        const platformSelect = document.getElementById('platformSelect');
        const chatroomInput = document.getElementById('chatroomInput');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');

        // إظهار أو إخفاء حقل Room ID بناءً على المنصة المختارة
        function togglePlatformInputs() {
            if (platformSelect.value === 'twitch') {
                chatroomInput.style.display = 'none';
            } else {
                chatroomInput.style.display = 'block';
            }
        }

        // دالة الاتصال بالشات (تتيح التبديل بين Kick وتويتش)
        function connectToChat() {
            const platform = platformSelect.value;
            const channelName = document.getElementById('channelNameInput').value.trim();

            if (!channelName) {
                alert('الرجاء إدخال اسم القناة');
                return;
            }

            if (platform === 'twitch') {
                // إيقاف أي اتصال سابق لتويتش
                if (twitchClient) {
                    twitchClient.disconnect();
                }

                twitchClient = new tmi.Client({
                    channels: [channelName]
                });

                twitchClient.connect().then(() => {
                    statusPill.className = 'status-pill online-twitch';
                    statusText.textContent = 'متصل (تويتش)';
                    alert('تم الاتصال بشات تويتش بنجاح!');
                }).catch(err => {
                    console.error(err);
                    statusPill.className = 'status-pill offline';
                    statusText.textContent = 'فشل الاتصال';
                    alert('حدث خطأ أثناء الاتصال بشات تويتش');
                });

                twitchClient.on('message', (target, context, message, self) => {
                    if (self) return;
                    handleIncomingMessage(context.username, message, 'twitch');
                });

            } else {
                // شات كيك عبر Pusher كما هو في الكود الأصلي
                const chatRoomId = chatroomInput.value.trim();
                if (!chatRoomId) {
                    alert('الرجاء إدخال رقم غرفة الشات الخاصة بكيك');
                    return;
                }

                if (pusher) {
                    pusher.disconnect();
                }

                Pusher.logToConsole = false;
                pusher = new Pusher('32cbd69e4b950defa749', {
                    cluster: 'us2'
                });

                channel = pusher.subscribe(`chatrooms.${chatRoomId}.v2`);
                
                channel.bind('App\\Events\\ChatMessageEvent', function(data) {
                    try {
                        const parsed = JSON.parse(data.data);
                        const username = parsed.sender.username;
                        const content = parsed.content;
                        handleIncomingMessage(username, content, 'kick');
                    } catch(e) {
                        console.error('Error parsing chat event', e);
                    }
                });

                statusPill.className = 'status-pill online';
                statusText.textContent = 'متصل (كيك)';
                alert('تم الاتصال بشات كيك بنجاح!');
            }
        }

        // معالجة الرسائل الواردة من المنصتين
        function handleIncomingMessage(username, content, platform) {
            const text = content.trim().toLowerCase();

            // 1. أمر الانضمام للعبة
            if (text === 'join') {
                if (gameStarted) return;
                if (!players.some(p => p.name.toLowerCase() === username.toLowerCase())) {
                    players.push({
                        id: nextNumber++,
                        name: username,
                        platform: platform,
                        alive: true,
                        bullets: Array(shotsPerPlayer).fill(null),
                        currentShotIndex: 0
                    });
                    updatePendingUI();
                }
            }

            // 2. اختيار الضحية أثناء دور الاختيار
            if (waitingForPick && chooser && chooser.name.toLowerCase() === username.toLowerCase()) {
                let targetPlayer = null;

                // البحث بالرقم المدخل
                const num = parseInt(text);
                if (!isNaN(num)) {
                    targetPlayer = players.find(p => p.id === num && p.alive);
                } else {
                    // البحث بالاسم
                    targetPlayer = players.find(p => p.name.toLowerCase() === text && p.alive);
                }

                if (targetPlayer) {
                    waitingForPick = false;
                    closePicker();
                    startShootingProcess(chooser, targetPlayer);
                }
            }
        }

        // باقي وظائف واجهة اللعبة والمنطق
        function updatePendingUI() {
            if (players.length === 0) {
                pendingGrid.innerHTML = `<div class="pending-empty">بانتظار أول مشارك...</div>`;
                manageGrid.innerHTML = `<div class="pending-empty">لا توجد لاعبين حالياً...</div>`;
                return;
            }

            let html = '';
            let manageHtml = '';

            players.forEach((p, idx) => {
                const badge = p.platform === 'twitch' 
                    ? `<span class="t-icon" title="Twitch">T</span>` 
                    : `<span class="k-icon" title="Kick">K</span>`;

                html += `
                    <div class="pending-chip">
                        <span class="remove-x" onclick="removePlayer(${idx})">✕</span>
                        ${badge}
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.name}</span>
                    </div>
                `;

                manageHtml += `
                    <div class="pending-chip">
                        <span class="remove-x" onclick="removePlayer(${idx})">✕</span>
                        ${badge}
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${p.name}</span>
                    </div>
                `;
            });

            pendingGrid.innerHTML = html;
            const manageGrid = document.getElementById('manageGrid');
            if (manageGrid) manageGrid.innerHTML = manageHtml;
        }

        function removePlayer(idx) {
            players.splice(idx, 1);
            updatePendingUI();
            if (gameStarted) {
                renderFancyGrid();
                drawWheel();
            }
        }

        function changeShotsCount(delta) {
            shotsPerPlayer = Math.min(5, Math.max(1, shotsPerPlayer + delta));
            shotsCountDisplay.textContent = shotsPerPlayer;
            renderChamberPreview();
        }

        function renderChamberPreview() {
            let html = '';
            for(let i=0; i<shotsPerPlayer; i++) {
                html += `<div class="dot ${i === 0 ? 'r' : 'g'}"></div>`;
            }
            chamberPreview.innerHTML = html;
        }
        renderChamberPreview();

        function startGame() {
            if (players.length < 2) {
                alert('يجب ان يكون هناك لاعبان على الأقل لبدء اللعبة!');
                return;
            }
            gameStarted = true;
            players.forEach(p => {
                p.bullets = Array(shotsPerPlayer).fill(null);
                p.currentShotIndex = 0;
                p.alive = true;
            });
            setupScreen.style.display = 'none';
            gameScreen.classList.add('show');
            renderFancyGrid();
            drawWheel();
        }

        function newGame() {
            gameStarted = false;
            waitingForPick = false;
            chooser = null;
            currentTarget = null;
            gameScreen.classList.remove('show');
            setupScreen.style.display = 'block';
            updatePendingUI();
        }

        function openManage() {
            document.getElementById('manageOverlay').classList.add('show');
        }
        function closeManage() {
            document.getElementById('manageOverlay').classList.remove('show');
            updatePendingUI();
            if (gameStarted) {
                renderFancyGrid();
                drawWheel();
            }
        }

        function renderFancyGrid() {
            let html = '';
            players.forEach(p => {
                let statusClass = '';
                if (!p.alive) statusClass = 'dead';
                if (chooser && chooser.id === p.id) statusClass += ' chooser';
                if (currentTarget && currentTarget.id === p.id) statusClass += ' targeted';

                let dotsHtml = '';
                for(let i=0; i<shotsPerPlayer; i++) {
                    let dotClass = '';
                    if (i < p.currentShotIndex) {
                        dotClass = p.bullets[i] === 'dead' ? 'dead-dot' : 'safe';
                    }
                    dotsHtml += `<span class="${dotClass}"></span>`;
                }

                const platformBadge = p.platform === 'twitch' 
                    ? `<span class="t-icon">T</span>` 
                    : `<span class="k-icon">K</span>`;

                html += `
                    <div class="fancy-chip ${statusClass}">
                        <div class="top-row">
                            <span class="num-badge-mini">#${p.id}</span>
                            <span class="chip-name">${p.name}</span>
                            ${platformBadge}
                        </div>
                        <div class="mini-dots">${dotsHtml}</div>
                    </div>
                `;
            });
            fancyGrid.innerHTML = html;
        }

        function drawWheel() {
            const alivePlayers = players.filter(p => p.alive);
            ctx.clearRect(0, 0, wheelCanvas.width, wheelCanvas.height);

            if (alivePlayers.length === 0) {
                emptyWheelMsg.textContent = 'لا يوجد لاعبين أحياء!';
                return;
            }
            emptyWheelMsg.textContent = '';

            const cx = wheelCanvas.width / 2;
            const cy = wheelCanvas.height / 2;
            const r = cx - 10;
            const arc = (2 * Math.PI) / alivePlayers.length;

            const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#6366f1', '#14b8a6', '#f43f5e'];

            alivePlayers.forEach((p, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle, angle + arc);
                ctx.lineTo(cx, cy);
                ctx.fill();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Cairo';
                ctx.fillText(p.name, r - 30, 6);
                ctx.restore();
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            const alivePlayers = players.filter(p => p.alive);
            if (alivePlayers.length === 0) return;

            isSpinning = true;
            spinBtn.disabled = true;

            const speedMultiplier = parseInt(document.getElementById('speedSlider').value) || 6;
            const randomExtra = Math.floor(Math.random() * 360);
            const fullSpins = 360 * (3 + Math.floor(speedMultiplier / 3));
            totalRotation += fullSpins + randomExtra;

            wheelCanvas.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                determineWinner(alivePlayers);
            }, 4000);
        }

        function determineWinner(alivePlayers) {
            const normalizedDeg = (360 - (totalRotation % 360)) % 360;
            const arcDeg = 360 / alivePlayers.length;
            const winningIndex = Math.floor(normalizedDeg / arcDeg);

            chooser = alivePlayers[winningIndex];
            renderFancyGrid();

            // إذا كان المختار وحيداً تم إعلان الفائز النهائي
            if (alivePlayers.length === 1) {
                alert(`انتهت اللعبة! الفائز الأخير هو ${chooser.name}`);
                return;
            }

            openPicker(chooser);
        }

        function openPicker(ch) {
            waitingForPick = true;
            pickerChooserName.textContent = ch.name;

            let html = '';
            players.filter(p => p.alive && p.id !== ch.id).forEach(p => {
                html += `
                    <button class="picker-btn" onclick="manualPickTarget(${p.id})">
                        <span class="num-badge">${p.id}</span>
                        <span style="overflow:hidden; text-overflow:ellipsis;">${p.name}</span>
                    </button>
                `;
            });
            pickerGrid.innerHTML = html;
            pickerOverlay.classList.add('show');
        }

        function closePicker() {
            pickerOverlay.classList.remove('show');
        }

        function manualPickTarget(id) {
            if (!waitingForPick) return;
            waitingForPick = false;
            closePicker();
            currentTarget = players.find(p => p.id === id);
            startShootingProcess(chooser, currentTarget);
        }

        function startShootingProcess(ch, target) {
            currentTarget = target;
            renderFancyGrid();

            shootTargetName.textContent = target.name;
            shootSubtitle.textContent = `دور ${ch.name} في إطلاق النار على ${target.name}`;
            targetChar.innerHTML = STICK_FIGURE_ALIVE;
            gunIcon.className = 'gun-icon';
            bulletFx.className = 'bullet-fx';
            muzzleFlash.className = 'muzzle-flash';
            resultMsg.textContent = '';
            resultMsg.className = 'result-msg';
            shootCloseBtn.style.display = 'none';

            // تجهيز خانات المسدس (رصاصة واحدة موزعة عشوائياً)
            const chambersCount = shotsPerPlayer;
            const bulletPos = Math.floor(Math.random() * chambersCount);

            let chambersHtml = '';
            for(let i=0; i<chambersCount; i++) {
                chambersHtml += `<div class="chamber-dot" id="chamber-${i}"></div>`;
            }
            chambersEl.innerHTML = chambersHtml;

            shootOverlay.classList.add('show');

            // بدء إطلاق النار بعد تأخير بسيط
            setTimeout(() => {
                fireGun(bulletPos, target);
            }, 1000);
        }

        function fireGun(bulletPos, target) {
            gunIcon.classList.add('recoil-strong', 'sprite-fire');
            bulletFx.classList.add('fire');
            muzzleFlash.classList.add('flash');
            shootScene.classList.add('shake');

            setTimeout(() => {
                shootScene.classList.remove('shake');
                gunIcon.classList.remove('recoil-strong', 'sprite-fire');
            }, 400);

            // تلوين الخانات
            for(let i=0; i<=target.currentShotIndex && i < shotsPerPlayer; i++) {
                const dot = document.getElementById(`chamber-${i}`);
                if (dot) {
                    if (i === bulletPos) {
                        dot.classList.add('used-dead');
                    } else {
                        dot.classList.add('used-safe');
                    }
                }
            }

            const isDead = (target.currentShotIndex === bulletPos);
            target.bullets[target.currentShotIndex] = isDead ? 'dead' : 'safe';
            target.currentShotIndex++;

            if (isDead) {
                target.alive = false;
                targetChar.innerHTML = STICK_FIGURE_DEAD;
                targetChar.classList.add('fallen');
                resultMsg.textContent = `💥 بانغ! أصابت الرصاصة ${target.name} ومات!`;
                resultMsg.className = 'result-msg dead';
            } else {
                targetChar.classList.add('flinch');
                setTimeout(() => targetChar.classList.remove('flinch'), 400);
                resultMsg.textContent = `✨ نجا ${target.name} هذه المرة!`;
                resultMsg.className = 'result-msg alive';
            }

            renderFancyGrid();
            shootCloseBtn.style.display = 'inline-block';
        }

        function closeShootOverlay() {
            shootOverlay.classList.remove('show');
            chooser = null;
            currentTarget = null;
            renderFancyGrid();
            drawWheel();

            // فحص انتهاء اللعبة (إذا بقي لاعب واحد فقط حي)
            const alive = players.filter(p => p.alive);
            if (alive.length <= 1) {
                if (alive.length === 1) {
                    alert(`انتهت اللعبة! الفائز الأخير هو ${alive[0].name} 🎉`);
                } else {
                    alert('انتهت اللعبة ولم يبق أحد حي!');
                }
                newGame();
            }
        }
    </script>
</body>
