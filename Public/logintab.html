<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول زلف | ZLF Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #050816;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* عشان تأثيرات الخلفية */
            position: relative;
        }

        /* حاوية الخلفية المتحركة */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* كرت الدخول */
        .login-card {
            background: rgba(10, 17, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 50px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            z-index: 1;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .brand-logo { margin-bottom: 25px; }
        .brand-logo img { 
            width: 80px; 
            height: 80px; 
            filter: drop-shadow(0 0 15px rgba(83, 252, 24, 0.4));
        }

        .welcome-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        .welcome-desc { font-size: 0.9rem; color: #929dae; margin-bottom: 40px; }

        .kick-login-btn {
            width: 100%;
            background: #53fc18;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .kick-login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.4);
        }

        .kick-login-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>
<body>

    <!-- حاوية الخلفية المتحركة -->
    <div id="particles-js"></div>

    <div class="login-card">
        <div class="brand-logo">
            <img src="/images/4.png" alt="Kick Logo">
        </div>
        <h1 class="welcome-title">دخول عالم زلف</h1>
        <p class="welcome-desc">اربط حسابك في Kick عشان تقدر تلعب.</p>

        <button id="kick-auth-trigger" class="kick-login-btn">
            <span>تسجيل الدخول عبر Kick</span>
        </button>
    </div>

    <!-- مكتبة Particle.js للخلفية المتحركة -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#3b82f6" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#3b82f6", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "repulse" } } }
        });

        // التوجيه الفعلي لمسار /login بالسيرفر، اللي يبدأ تدفق OAuth الحقيقي مع Kick
        document.getElementById('kick-auth-trigger').addEventListener('click', () => {
            const btn = document.getElementById('kick-auth-trigger');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'جارٍ التوجيه...';
            window.location.href = '/login';
        });
    </script>
</body>
</html>
